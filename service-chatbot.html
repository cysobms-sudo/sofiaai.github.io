<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>دستیارهای هوشمند | سوفیا AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        :root {
            --primary: #6C3CE1;
            --primary-light: #8B6CE0;
            --primary-dark: #4A1F9E;
            --secondary: #FFB800;
            --secondary-light: #FFD64A;
            --secondary-dark: #E69D00;
            --bg-light: #FBF8FF;
            --text-dark: #1A0F2E;
            --text-muted: #5A4A7A;
            --text-light: #9A8AB5;
            --card-bg: #FFFFFF;
            --border-color: rgba(108, 60, 225, 0.08);
            --shadow: 0 4px 24px rgba(108, 60, 225, 0.06);
            --shadow-hover: 0 12px 48px rgba(108, 60, 225, 0.12);
            --shadow-lg: 0 20px 60px rgba(108, 60, 225, 0.15);
            --radius: 24px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #f39c12;
            --info: #3498db;
            --assistant-gradient-1: #6C3CE1;
            --assistant-gradient-2: #00D2FF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            direction: rtl;
            line-height: 1.9;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
        a { text-decoration: none; color: inherit; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-80px) scale(0.95); }
            to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }
        @keyframes slideUp {
            from { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
            to { opacity: 0; transform: translateX(-50%) translateY(-80px) scale(0.95); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .fade-up { animation: fadeUp 0.8s ease; }
        .fade-up-delay-1 { animation: fadeUp 0.8s ease 0.1s both; }
        .fade-up-delay-2 { animation: fadeUp 0.8s ease 0.2s both; }
        .fade-up-delay-3 { animation: fadeUp 0.8s ease 0.3s both; }

        /* ===== نوار ناوبری ===== */
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-bottom: 2px solid var(--secondary);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 24px rgba(108, 60, 225, 0.04);
        }
        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-image {
            height: 80px;
            width: auto;
            max-width: 280px;
            object-fit: contain;
            transition: transform var(--transition);
        }
        .logo-image:hover { transform: scale(1.04); }
        .logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .logo-text .main {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--text-dark);
        }
        .logo-text .main .highlight { color: var(--primary); }
        .logo-text .sub {
            font-size: 0.55rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .nav-menu {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }
        .nav-menu a {
            color: var(--text-dark);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: var(--transition);
        }
        .nav-menu a:hover {
            background: rgba(108, 60, 225, 0.06);
            color: var(--primary);
        }
        .nav-menu .btn-register {
            background: linear-gradient(145deg, var(--secondary), var(--secondary-dark));
            color: var(--text-dark) !important;
            font-weight: 700;
            padding: 6px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(255, 184, 0, 0.25);
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .nav-menu .btn-register:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255, 184, 0, 0.35);
        }
        .nav-menu .btn-login {
            background: var(--primary);
            color: #fff !important;
            font-weight: 700;
            padding: 6px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(108, 60, 225, 0.25);
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .nav-menu .btn-login:hover {
            transform: scale(1.05);
            background: var(--primary-dark);
            box-shadow: 0 6px 25px rgba(108, 60, 225, 0.35);
        }
        .nav-menu .btn-logout {
            background: var(--danger);
            color: #fff !important;
            font-weight: 700;
            padding: 6px 18px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Vazirmatn', sans-serif;
            display: none;
        }
        .nav-menu .btn-logout:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(231, 76, 60, 0.3);
        }
        .nav-menu .cart-link {
            background: var(--primary);
            color: #fff !important;
            padding: 6px 18px !important;
            border-radius: 30px !important;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700 !important;
            box-shadow: 0 4px 15px rgba(108, 60, 225, 0.2);
        }
        .nav-menu .cart-link:hover {
            background: var(--primary-dark) !important;
            transform: scale(1.04);
        }
        .cart-badge {
            background: var(--secondary);
            color: var(--text-dark);
            border-radius: 50%;
            padding: 0 8px;
            font-size: 0.75rem;
            font-weight: 900;
            display: inline-block;
            min-width: 22px;
            text-align: center;
        }
        .user-name-display {
            font-weight: 700;
            color: var(--primary);
            padding: 6px 14px;
            font-size: 0.9rem;
            display: none;
        }
        .user-name-display.show {
            display: inline-block;
        }

        /* ===== هدر سرویس ===== */
        .service-hero {
            padding: 70px 0 50px;
            background: linear-gradient(145deg, #FBF8FF 0%, #F0E8FF 50%, #FFF9E6 100%);
            border-bottom: 2px solid var(--secondary);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .service-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 70% 30%, rgba(108, 60, 225, 0.05), transparent 60%);
            pointer-events: none;
        }
        .service-hero .floating-icon {
            position: absolute;
            font-size: 5rem;
            opacity: 0.06;
            color: var(--primary);
        }
        .service-hero .floating-icon:nth-child(1) { top: 10%; right: 5%; animation: float 6s ease-in-out infinite; }
        .service-hero .floating-icon:nth-child(2) { bottom: 15%; left: 8%; animation: float 8s ease-in-out infinite reverse; }
        .service-hero .floating-icon:nth-child(3) { top: 50%; left: 3%; font-size: 3rem; animation: float 7s ease-in-out infinite; }
        .service-hero .floating-icon:nth-child(4) { top: 20%; right: 3%; font-size: 3rem; animation: float 5s ease-in-out infinite reverse; }

        .service-hero .hero-badge {
            display: inline-block;
            background: rgba(108, 60, 225, 0.08);
            color: var(--primary);
            padding: 4px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .service-hero h1 {
            font-size: 3.2rem;
            font-weight: 900;
            margin-bottom: 12px;
            color: var(--text-dark);
            position: relative;
            z-index: 1;
        }
        .service-hero h1 .highlight {
            background: linear-gradient(145deg, var(--assistant-gradient-1), var(--assistant-gradient-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .service-hero .subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto 20px;
            position: relative;
            z-index: 1;
            line-height: 2;
        }
        .service-hero .price-tag {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--secondary);
            padding: 10px 36px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-dark);
            box-shadow: 0 4px 20px rgba(255, 184, 0, 0.25);
            position: relative;
            z-index: 1;
        }
        .service-hero .price-tag i {
            color: var(--primary);
        }
        .service-hero .price-tag .old-price {
            text-decoration: line-through;
            opacity: 0.5;
            font-weight: 400;
            font-size: 0.9rem;
        }

        /* ===== استاتیک‌ها ===== */
        .stats-bar {
            padding: 30px 0;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            text-align: center;
        }
        .stat-item .number {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary);
            display: block;
        }
        .stat-item .label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ===== دستیار هوشمند چیست؟ ===== */
        .what-is-assistant {
            padding: 60px 0;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
        }
        .assistant-explanation {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }
        .assistant-explanation .text h2 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 16px;
            color: var(--text-dark);
        }
        .assistant-explanation .text h2 .highlight {
            background: linear-gradient(145deg, var(--assistant-gradient-1), var(--assistant-gradient-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .assistant-explanation .text p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 2.1;
            margin-bottom: 12px;
        }
        .assistant-explanation .visual {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .assistant-flow-horizontal {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            background: var(--bg-light);
            padding: 20px 24px;
            border-radius: var(--radius);
            border: 2px solid var(--border-color);
            direction: ltr;
        }
        .assistant-flow-horizontal .step {
            background: #fff;
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--primary-light);
            text-align: center;
            font-weight: 700;
            font-size: 0.95rem;
            min-width: 90px;
            font-family: 'Vazirmatn', sans-serif;
            direction: rtl;
        }
        .assistant-flow-horizontal .step .icon {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 4px;
        }
        .assistant-flow-horizontal .arrow {
            font-size: 1.8rem;
            color: var(--primary-light);
            font-weight: 900;
            padding: 0 4px;
        }
        @media (max-width: 768px) {
            .assistant-flow-horizontal {
                flex-direction: column;
                padding: 16px;
            }
            .assistant-flow-horizontal .arrow {
                transform: rotate(90deg);
                padding: 2px 0;
            }
            .assistant-flow-horizontal .step {
                min-width: 70px;
                padding: 10px 16px;
                font-size: 0.85rem;
            }
        }

        /* ===== نمونه کارهای عملی ===== */
        .portfolio-showcase {
            padding: 70px 0;
            background: linear-gradient(145deg, #FBF8FF, #F0E8FF);
            border-bottom: 1px solid var(--border-color);
        }
        .portfolio-showcase .section-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .portfolio-showcase .section-header h2 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--text-dark);
        }
        .portfolio-showcase .section-header h2 .highlight {
            color: var(--primary);
        }
        .portfolio-showcase .section-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 650px;
            margin: 8px auto 0;
        }

        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 40px;
        }

        .showcase-card {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            border: 2px solid var(--border-color);
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .showcase-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }

        .showcase-card .card-header {
            padding: 28px 28px 16px;
            position: relative;
        }
        .showcase-card .card-header .icon-badge {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 8px;
        }
        .showcase-card .card-header .status-badge {
            display: inline-block;
            background: var(--success);
            color: #fff;
            padding: 2px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .showcase-card .card-header h3 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-dark);
        }
        .showcase-card .card-header .industry-tag {
            color: var(--text-muted);
            font-size: 0.85rem;
            display: block;
            margin-top: 2px;
        }

        .showcase-card .card-body {
            padding: 0 28px 20px;
        }
        .showcase-card .card-body p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.9;
        }
        .showcase-card .card-body .features-list {
            list-style: none;
            padding: 0;
            margin: 12px 0 16px;
        }
        .showcase-card .card-body .features-list li {
            padding: 4px 0;
            color: var(--text-dark);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .showcase-card .card-body .features-list li i {
            color: var(--primary);
            font-size: 0.8rem;
        }

        .showcase-card .card-footer {
            padding: 16px 28px 28px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .showcase-card .card-footer .demo-link {
            background: var(--primary);
            color: #fff;
            padding: 10px 28px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .showcase-card .card-footer .demo-link:hover {
            background: var(--primary-dark);
            transform: scale(1.04);
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.3);
        }
        .showcase-card .card-footer .result-badge {
            background: rgba(255, 184, 0, 0.15);
            color: var(--secondary-dark);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* ===== موارد استفاده ===== */
        .use-cases-section {
            padding: 60px 0;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
        }
        .section-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .section-header h2 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--text-dark);
        }
        .section-header h2 .highlight {
            background: linear-gradient(145deg, var(--assistant-gradient-1), var(--assistant-gradient-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .use-cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }
        .use-case-card {
            background: var(--bg-light);
            border-radius: var(--radius);
            padding: 28px 24px;
            border: 2px solid var(--border-color);
            transition: var(--transition);
        }
        .use-case-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-light);
        }
        .use-case-card .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
        }
        .use-case-card h4 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .use-case-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.8;
        }
        .use-case-card .badge-case {
            display: inline-block;
            background: rgba(108, 60, 225, 0.06);
            color: var(--primary);
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 0.65rem;
            font-weight: 700;
            margin-top: 8px;
        }

        /* ===== ویژگی‌ها ===== */
        .features-section {
            padding: 60px 0;
            background: var(--bg-light);
            border-bottom: 1px solid var(--border-color);
        }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
        }
        .feature-box {
            text-align: center;
            padding: 30px 20px;
            border-radius: var(--radius);
            background: #fff;
            border: 2px solid var(--border-color);
            transition: var(--transition);
        }
        .feature-box:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .feature-box .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
        }
        .feature-box h4 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .feature-box p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.8;
        }

        /* ===== فرآیند طراحی ===== */
        .process-section {
            padding: 60px 0;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
        }
        .process-timeline {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            position: relative;
        }
        .process-step {
            text-align: center;
            padding: 20px;
            background: var(--bg-light);
            border-radius: var(--radius);
            border: 2px solid var(--border-color);
            transition: var(--transition);
        }
        .process-step:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .process-step .number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, var(--assistant-gradient-1), var(--assistant-gradient-2));
            color: #fff;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 12px;
        }
        .process-step h4 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .process-step p {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.7;
        }

        /* ===== فرم سفارش ===== */
        .request-section {
            padding: 60px 0;
            background: var(--bg-light);
            border-bottom: 1px solid var(--border-color);
        }
        .request-box {
            max-width: 820px;
            margin: 0 auto;
            background: #fff;
            padding: 48px 52px;
            border-radius: var(--radius);
            border: 2px solid var(--secondary);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }
        .request-box::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--assistant-gradient-1), var(--assistant-gradient-2));
        }
        .request-box .form-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .request-box .form-header h2 {
            font-size: 1.8rem;
            font-weight: 900;
        }
        .request-box .form-header h2 .highlight {
            background: linear-gradient(145deg, var(--assistant-gradient-1), var(--assistant-gradient-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .request-box .form-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .request-box .form-group {
            margin-bottom: 18px;
        }
        .request-box label {
            display: block;
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.9rem;
            margin-bottom: 4px;
        }
        .request-box label .required {
            color: var(--danger);
        }
        .request-box input,
        .request-box textarea,
        .request-box select {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border-color);
            font-size: 1rem;
            font-family: 'Vazirmatn', sans-serif;
            background: #fff;
            transition: var(--transition);
        }
        .request-box input:focus,
        .request-box textarea:focus,
        .request-box select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(108, 60, 225, 0.06);
        }
        .request-box textarea {
            min-height: 140px;
            resize: vertical;
        }
        .request-box .btn-submit {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            padding: 16px 32px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .request-box .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 30px rgba(108, 60, 225, 0.3);
        }
        .request-box .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .request-box .message {
            text-align: center;
            margin-top: 16px;
            padding: 14px;
            border-radius: var(--radius-sm);
            display: none;
            font-weight: 600;
        }
        .request-box .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .request-box .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* ===== CTA ===== */
        .cta-section {
            padding: 50px 0;
            text-align: center;
        }
        .cta-box {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            padding: 48px 40px;
            border-radius: var(--radius);
            border: 2px solid var(--secondary);
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .cta-box::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 70% 30%, rgba(255, 184, 0, 0.08), transparent 60%);
            pointer-events: none;
        }
        .cta-box h2 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }
        .cta-box p {
            font-size: 1.05rem;
            opacity: 0.9;
            margin-bottom: 24px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            z-index: 1;
        }
        .btn-add-cart {
            background: var(--secondary);
            color: var(--text-dark);
            border: none;
            padding: 16px 48px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Vazirmatn', sans-serif;
            box-shadow: 0 4px 20px rgba(255, 184, 0, 0.2);
            position: relative;
            z-index: 1;
        }
        .btn-add-cart:hover {
            transform: scale(1.04);
            background: var(--secondary-light);
            box-shadow: 0 8px 30px rgba(255, 184, 0, 0.35);
        }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            position: relative;
            z-index: 1;
        }
        .back-link:hover {
            color: #fff;
        }
        .back-link i {
            margin-left: 6px;
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            direction: rtl;
        }
        .toast {
            padding: 14px 32px;
            border-radius: var(--radius-sm);
            color: #fff;
            font-weight: 600;
            font-family: 'Vazirmatn', sans-serif;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.12);
            animation: slideDown 0.5s ease;
            min-width: 220px;
            text-align: center;
            font-size: 0.95rem;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--info); }
        .toast.warning { background: var(--warning); }

            padding: 4px 12px;
            border-radius: 30px;

        footer .footer-links a:hover { color: var(--primary); }
        footer .footer-links .btn-register-footer {
            background: var(--secondary);
            color: var(--text-dark) !important;
            font-weight: 700;
        }
        footer .footer-links .btn-login-footer {
            background: var(--primary);
            color: #fff !important;
            font-weight: 700;
        }

            padding: 0;
            background: none;
            border: none;
            line-height: 0;
