<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پنل مدیریت | توسعه‌دهنده هوش مصنوعی سوفیا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        :root {
            --primary: #6C3CE1;
            --primary-dark: #4A1F9E;
            --secondary: #FFB800;
            --bg-light: #FBF8FF;
            --text-dark: #1A0F2E;
            --text-muted: #5A4A7A;
            --border-color: rgba(108, 60, 225, 0.08);
            --radius: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #f0f2f5;
            color: var(--text-dark);
            direction: rtl;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* ===== هدر ===== */
        .header {
            background: #fff;
            border-bottom: 2px solid var(--secondary);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        .header .logo {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text-dark);
        }
        .header .logo .highlight { color: var(--primary); }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header .user-info .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            text-decoration: none;
        }
        .header .user-info .btn-outline:hover {
            background: var(--primary);
            color: #fff;
        }
        .header .user-info .logout-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
        }
        .header .user-info .logout-btn:hover {
            transform: scale(1.05);
            background: #c0392b;
        }

        /* ===== تب‌ها ===== */
        .tabs {
            display: flex;
            gap: 8px;
            margin: 24px 0;
            flex-wrap: wrap;
            border-bottom: 2px solid #e8ecf1;
            padding-bottom: 12px;
        }
        .tab-btn {
            background: transparent;
            color: #5A4A7A;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
        }
        .tab-btn:hover {
            background: rgba(108, 60, 225, 0.06);
            color: var(--primary);
        }
        .tab-btn.active {
            background: var(--primary);
            color: #fff;
        }
        .tab-content {
            display: none;
            background: #fff;
            padding: 24px;
            border-radius: var(--radius);
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        .tab-content.active { display: block; }

        /* ===== فرم‌ها ===== */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-dark);
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            font-size: 1rem;
            font-family: 'Vazirmatn', sans-serif;
            transition: 0.3s;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(108, 60, 225, 0.06);
        }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .btn-save {
            background: linear-gradient(145deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
        }
        .btn-save:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(108, 60, 225, 0.3);
        }
        .btn-danger {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
        }
        .btn-danger:hover { background: #c0392b; }
        .btn-approve {
            background: #28a745;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
        }
        .btn-approve:hover { background: #1e7e34; }

        /* ===== جدول‌ها ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        th {
            background: var(--primary);
            color: #fff;
            padding: 12px 16px;
            text-align: right;
            font-weight: 700;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        tr:hover { background: var(--bg-light); }
        .empty { text-align: center; color: var(--text-muted); padding: 40px 0; }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-approved { background: #d4edda; color: #155724; }
        .badge-rejected { background: #f8d7da; color: #721c24; }

        /* ===== واکنش‌گرا ===== */
        @media (max-width: 768px) {
            .container { padding: 12px; }
            .tabs { gap: 4px; }
            .tab-btn { padding: 6px 14px; font-size: 0.8rem; }
            .tab-content { padding: 16px; }
            table { font-size: 0.8rem; }
            th, td { padding: 8px 10px; }
        }
    </style>
</head>
<body>

    <!-- ===== هدر ===== -->
    <header class="header">
        <div class="logo">
            توسعه‌دهنده هوش مصنوعی <span class="highlight">سوفیا</span>
            <span style="display:block; font-size:0.65rem; color:var(--text-muted); font-weight:400;">پنل مدیریت</span>
        </div>
        <div class="user-info">
            <span id="adminName" style="font-weight:700;">مدیر</span>
            <a href="index.html" class="btn-outline"><i class="fas fa-home"></i> بازگشت به سایت</a>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </div>
    </header>

    <div class="container">

        <!-- ===== تب‌ها ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="dashboard">📊 داشبورد</button>
            <button class="tab-btn" data-tab="articles">📝 مقالات</button>
            <button class="tab-btn" data-tab="comments">💬 نظرات</button>
            <button class="tab-btn" data-tab="settings">⚙️ تنظیمات</button>
        </div>

        <!-- ===== تب داشبورد ===== -->
        <div id="tab-dashboard" class="tab-content active">
            <h2 style="margin-bottom:16px;">📊 خلاصه مدیریت</h2>
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:20px;">
                <div style="background:var(--bg-light); padding:20px; border-radius:var(--radius); text-align:center;">
                    <span style="font-size:2rem; display:block; color:var(--primary);" id="statsArticles">0</span>
                    <span>مقالات</span>
                </div>
                <div style="background:var(--bg-light); padding:20px; border-radius:var(--radius); text-align:center;">
                    <span style="font-size:2rem; display:block; color:var(--secondary);" id="statsComments">0</span>
                    <span>نظرات</span>
                </div>
                <div style="background:var(--bg-light); padding:20px; border-radius:var(--radius); text-align:center;">
                    <span style="font-size:2rem; display:block; color:#28a745;" id="statsPending">0</span>
                    <span>نظرات در انتظار تایید</span>
                </div>
            </div>
        </div>

        <!-- ===== تب مقالات ===== -->
        <div id="tab-articles" class="tab-content">
            <h2 style="margin-bottom:16px;">📝 مدیریت مقالات</h2>
            <button class="btn-save" onclick="showAddArticleForm()" style="margin-bottom:16px;">
                <i class="fas fa-plus"></i> افزودن مقاله جدید
            </button>
            <div id="addArticleForm" style="display:none; background:var(--bg-light); padding:20px; border-radius:var(--radius); margin-bottom:16px;">
                <h3>✍️ مقاله جدید</h3>
                <div class="form-group">
                    <label>عنوان مقاله</label>
                    <input type="text" id="articleTitle" placeholder="عنوان مقاله را وارد کنید" />
                </div>
                <div class="form-group">
                    <label>دسته‌بندی</label>
                    <input type="text" id="articleCategory" placeholder="مثلاً: هوش مصنوعی، ایجنت، آموزش" />
                </div>
                <div class="form-group">
                    <label>متن مقاله</label>
                    <textarea id="articleContent" placeholder="متن مقاله را وارد کنید..."></textarea>
                </div>
                <div class="form-group">
                    <label>نویسنده</label>
                    <input type="text" id="articleAuthor" placeholder="نام نویسنده" value="سوفیا AI" />
                </div>
                <button class="btn-save" onclick="saveArticle()">💾 ذخیره مقاله</button>
                <button class="btn-danger" onclick="document.getElementById('addArticleForm').style.display='none'">انصراف</button>
            </div>
            <div id="articlesList"><div class="empty">⏳ در حال بارگذاری...</div></div>
        </div>

        <!-- ===== تب نظرات ===== -->
        <div id="tab-comments" class="tab-content">
            <h2 style="margin-bottom:16px;">💬 مدیریت نظرات</h2>
            <div id="commentsList"><div class="empty">⏳ در حال بارگذاری...</div></div>
        </div>

        <!-- ===== تب تنظیمات ===== -->
        <div id="tab-settings" class="tab-content">
            <h2 style="margin-bottom:16px;">⚙️ تنظیمات سایت</h2>
            <div id="settingsForm">
                <div class="form-group">
                    <label>متن درباره ما</label>
                    <textarea id="setting_about_text" rows="6"></textarea>
                </div>
                <div class="form-group">
                    <label>شماره تماس</label>
                    <input type="text" id="setting_phone" />
                </div>
                <div class="form-group">
                    <label>ایمیل</label>
                    <input type="email" id="setting_email" />
                </div>
                <div class="form-group">
                    <label>آدرس</label>
                    <input type="text" id="setting_address" />
                </div>
                <div class="form-group">
                    <label>متن فوتر</label>
                    <input type="text" id="setting_footer_text" />
                </div>
                <button class="btn-save" onclick="saveSettings()">💾 ذخیره تنظیمات</button>
            </div>
        </div>

    </div>

    <script>
        // =============================================
        // ===== مدیریت تب‌ها =====
        // =============================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                document.getElementById('tab-' + this.dataset.tab).classList.add('active');
                if (this.dataset.tab === 'dashboard') loadDashboardStats();
                else if (this.dataset.tab === 'articles') loadArticles();
                else if (this.dataset.tab === 'comments') loadComments();
                else if (this.dataset.tab === 'settings') loadSettings();
            });
        });

        // =============================================
        // ===== خروج =====
        // =============================================
        function logout() {
            localStorage.removeItem('admin');
            window.location.href = 'login.html';
        }

        // =============================================
        // ===== ۱. آمار داشبورد =====
        // =============================================
        function loadDashboardStats() {
            fetch('/api/admin/stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('statsArticles').textContent = data.articles || 0;
                    document.getElementById('statsComments').textContent = data.comments || 0;
                    document.getElementById('statsPending').textContent = data.pending || 0;
                })
                .catch(() => {
                    document.getElementById('statsArticles').textContent = 'خطا';
                });
        }

        // =============================================
        // ===== ۲. مدیریت مقالات =====
        // =============================================
        function loadArticles() {
            const container = document.getElementById('articlesList');
            container.innerHTML = '<div class="empty">⏳ در حال بارگذاری...</div>';

            fetch('/api/admin/articles')
                .then(res => res.json())
                .then(data => {
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty">❌ هیچ مقاله‌ای وجود ندارد.</div>';
                        return;
                    }
                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>عنوان</th>
                                    <th>دسته‌بندی</th>
                                    <th>نویسنده</th>
                                    <th>تاریخ</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    data.forEach((item, index) => {
                        html += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${item.title}</td>
                                <td>${item.category}</td>
                                <td>${item.author}</td>
                                <td>${item.created_at}</td>
                                <td>
                                    <button class="btn-danger" onclick="deleteArticle(${item.id})">
                                        <i class="fas fa-trash-alt"></i> حذف
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                    html += `</tbody></table>`;
                    container.innerHTML = html;
                })
                .catch(() => {
                    container.innerHTML = '<div class="empty">❌ خطا در دریافت اطلاعات.</div>';
                });
        }

        function showAddArticleForm() {
            document.getElementById('addArticleForm').style.display = 'block';
            document.getElementById('articleTitle').value = '';
            document.getElementById('articleCategory').value = '';
            document.getElementById('articleContent').value = '';
        }

        function saveArticle() {
            const title = document.getElementById('articleTitle').value.trim();
            const category = document.getElementById('articleCategory').value.trim();
            const content = document.getElementById('articleContent').value.trim();
            const author = document.getElementById('articleAuthor').value.trim() || 'سوفیا AI';

            if (!title || !category || !content) {
                alert('⚠️ لطفاً تمام فیلدها را پر کنید.');
                return;
            }

            fetch('/api/admin/articles', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, category, content, author })
            })
            .then(res => res.json())
            .then(data => {
                if (data.message) {
                    alert('✅ ' + data.message);
                    document.getElementById('addArticleForm').style.display = 'none';
                    loadArticles();
                    loadDashboardStats();
                } else {
                    alert('❌ ' + data.error);
                }
            })
            .catch(() => alert('❌ خطا در ارتباط با سرور.'));
        }

        function deleteArticle(id) {
            if (!confirm('⚠️ آیا از حذف این مقاله اطمینان دارید؟')) return;
            fetch(`/api/admin/articles/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.message) {
                        alert('✅ ' + data.message);
                        loadArticles();
                        loadDashboardStats();
                    } else {
                        alert('❌ ' + data.error);
                    }
                })
                .catch(() => alert('❌ خطا در حذف مقاله.'));
        }

        // =============================================
        // ===== ۳. مدیریت نظرات =====
        // =============================================
        function loadComments() {
            const container = document.getElementById('commentsList');
            container.innerHTML = '<div class="empty">⏳ در حال بارگذاری...</div>';

            fetch('/api/admin/comments')
                .then(res => res.json())
                .then(data => {
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty">❌ هیچ نظری وجود ندارد.</div>';
                        return;
                    }
                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>نام</th>
                                    <th>ایمیل</th>
                                    <th>متن نظر</th>
                                    <th>وضعیت</th>
                                    <th>تاریخ</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    data.forEach((item, index) => {
                        const statusMap = {
                            'pending': '<span class="badge badge-pending">در انتظار تایید</span>',
                            'approved': '<span class="badge badge-approved">تایید شده</span>',
                            'rejected': '<span class="badge badge-rejected">رد شده</span>'
                        };
                        html += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${item.name}</td>
                                <td>${item.email || '-'}</td>
                                <td style="max-width:200px; word-break:break-word;">${item.text}</td>
                                <td>${statusMap[item.status] || item.status}</td>
                                <td>${item.created_at}</td>
                                <td>
                                    ${item.status === 'pending' ? `
                                        <button class="btn-approve" onclick="approveComment(${item.id})">
                                            <i class="fas fa-check"></i> تایید
                                        </button>
                                        <button class="btn-danger" onclick="rejectComment(${item.id})">
                                            <i class="fas fa-times"></i> رد
                                        </button>
                                    ` : `
                                        <button class="btn-danger" onclick="deleteComment(${item.id})">
                                            <i class="fas fa-trash-alt"></i> حذف
                                        </button>
                                    `}
                                </td>
                            </tr>
                        `;
                    });
                    html += `</tbody></table>`;
                    container.innerHTML = html;
                })
                .catch(() => {
                    container.innerHTML = '<div class="empty">❌ خطا در دریافت اطلاعات.</div>';
                });
        }

        function approveComment(id) {
            fetch(`/api/admin/comments/${id}/approve`, { method: 'PUT' })
                .then(res => res.json())
                .then(data => {
                    if (data.message) {
                        alert('✅ ' + data.message);
                        loadComments();
                        loadDashboardStats();
                    } else {
                        alert('❌ ' + data.error);
                    }
                })
                .catch(() => alert('❌ خطا در تایید نظر.'));
        }

        function rejectComment(id) {
            if (!confirm('⚠️ آیا از رد این نظر اطمینان دارید؟')) return;
            fetch(`/api/admin/comments/${id}/reject`, { method: 'PUT' })
                .then(res => res.json())
                .then(data => {
                    if (data.message) {
                        alert('✅ ' + data.message);
                        loadComments();
                        loadDashboardStats();
                    } else {
                        alert('❌ ' + data.error);
                    }
                })
                .catch(() => alert('❌ خطا در رد نظر.'));
        }

        function deleteComment(id) {
            if (!confirm('⚠️ آیا از حذف این نظر اطمینان دارید؟')) return;
            fetch(`/api/admin/comments/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.message) {
                        alert('✅ ' + data.message);
                        loadComments();
                        loadDashboardStats();
                    } else {
                        alert('❌ ' + data.error);
                    }
                })
                .catch(() => alert('❌ خطا در حذف نظر.'));
        }

        // =============================================
        // ===== ۴. تنظیمات سایت =====
        // =============================================
        function loadSettings() {
            fetch('/api/admin/settings')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('setting_about_text').value = data.about_text || '';
                    document.getElementById('setting_phone').value = data.phone || '';
                    document.getElementById('setting_email').value = data.email || '';
                    document.getElementById('setting_address').value = data.address || '';
                    document.getElementById('setting_footer_text').value = data.footer_text || '';
                })
                .catch(() => alert('❌ خطا در دریافت تنظیمات.'));
        }

        function saveSettings() {
            const settings = {
                about_text: document.getElementById('setting_about_text').value,
                phone: document.getElementById('setting_phone').value,
                email: document.getElementById('setting_email').value,
                address: document.getElementById('setting_address').value,
                footer_text: document.getElementById('setting_footer_text').value
            };

            fetch('/api/admin/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(settings)
            })
            .then(res => res.json())
            .then(data => {
                if (data.message) {
                    alert('✅ ' + data.message);
                } else {
                    alert('❌ ' + data.error);
                }
            })
            .catch(() => alert('❌ خطا در ذخیره تنظیمات.'));
        }

        // =============================================
        // ===== بارگذاری اولیه =====
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboardStats();
            document.getElementById('adminName').textContent = 'مدیر';
        });
    </script>

</body>
</html>
