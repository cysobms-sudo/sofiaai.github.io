<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پنل مدیریت | سوفیا AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazirmatn', sans-serif; background: #f0f2f5; direction: rtl; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; border: 2px solid #FFB800; }
        .login-box { max-width: 400px; margin: 50px auto; padding: 30px; background: #fff; border-radius: 16px; border: 2px solid #6C3CE1; text-align: center; }
        .login-box input { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #ddd; font-size: 1rem; margin-bottom: 12px; font-family: 'Vazirmatn', sans-serif; }
        .login-box button { width: 100%; padding: 12px; background: #6C3CE1; color: #fff; border: none; border-radius: 30px; font-weight: 700; cursor: pointer; font-family: 'Vazirmatn', sans-serif; }
        .login-box .error { color: #e74c3c; margin-top: 10px; display: none; }
        .tabs { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; border-bottom: 2px solid #e8ecf1; padding-bottom: 12px; }
        .tab-btn { padding: 10px 24px; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; font-family: 'Vazirmatn', sans-serif; background: transparent; color: #5A4A7A; }
        .tab-btn.active { background: #6C3CE1; color: #fff; }
        .tab-content { display: none; background: #f8f9fc; padding: 20px; border-radius: 12px; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; border-radius: 10px; border: 2px solid #ddd; font-size: 1rem; font-family: 'Vazirmatn', sans-serif; }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .btn-primary { background: #6C3CE1; color: #fff; border: none; padding: 10px 30px; border-radius: 30px; font-weight: 700; cursor: pointer; font-family: 'Vazirmatn', sans-serif; }
        .btn-primary:hover { background: #4A1F9E; }
        .back-link { display: inline-block; margin-top: 20px; color: #6C3CE1; text-decoration: none; font-weight: 600; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .status-msg { margin-right: 16px; font-weight: 600; }
        .status-msg.success { color: #28a745; }
        .status-msg.error { color: #e74c3c; }
        .status-msg.loading { color: #f39c12; }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== ورود ===== -->
        <div id="loginPage" class="login-box">
            <h2>🔐 پنل مدیریت</h2>
            <p style="color:#7a7a9a;">رمز عبور را وارد کنید</p>
            <input type="password" id="adminPassword" placeholder="رمز عبور..." />
            <button onclick="checkLogin()">ورود</button>
            <div id="loginError" class="error">❌ رمز عبور اشتباه است!</div>
        </div>

        <!-- ===== پنل ===== -->
        <div id="adminPanel" style="display:none;">

            <h2 style="border-bottom:2px solid #FFB800; padding-bottom:12px;">📋 پنل مدیریت</h2>

            <div class="tabs">
                <button class="tab-btn active" data-tab="pages">📄 صفحات</button>
                <button class="tab-btn" data-tab="settings">⚙️ تنظیمات</button>
            </div>

            <!-- ===== تب صفحات ===== -->
            <div id="tab-pages" class="tab-content active">
                <h3>مدیریت صفحات</h3>

                <div style="border-bottom:1px solid #ddd; padding-bottom:16px; margin-bottom:16px;">
                    <h4 style="color:#6C3CE1;">🏠 صفحه اصلی</h4>
                    <div class="form-group">
                        <label>عنوان اصلی</label>
                        <input type="text" id="page_hero_title" />
                    </div>
                    <div class="form-group">
                        <label>زیر عنوان</label>
                        <input type="text" id="page_hero_subtitle" />
                    </div>
                    <div class="form-group">
                        <label>متن توصیفی</label>
                        <textarea id="page_hero_text" rows="2"></textarea>
                    </div>
                </div>

                <div style="border-bottom:1px solid #ddd; padding-bottom:16px; margin-bottom:16px;">
                    <h4 style="color:#6C3CE1;">📖 درباره ما</h4>
                    <div class="form-group">
                        <label>عنوان</label>
                        <input type="text" id="page_about_title" />
                    </div>
                    <div class="form-group">
                        <label>متن درباره ما</label>
                        <textarea id="page_about_text" rows="4"></textarea>
                    </div>
                </div>

                <div style="border-bottom:1px solid #ddd; padding-bottom:16px; margin-bottom:16px;">
                    <h4 style="color:#6C3CE1;">📌 فوتر</h4>
                    <div class="form-group">
                        <label>متن فوتر</label>
                        <input type="text" id="page_footer_text" />
                    </div>
                    <div class="form-group">
                        <label>متن کپی‌رایت</label>
                        <input type="text" id="page_copyright_text" />
                    </div>
                </div>

                <div style="border-bottom:1px solid #ddd; padding-bottom:16px; margin-bottom:16px;">
                    <h4 style="color:#6C3CE1;">📊 آمار</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>سال سابقه</label>
                            <input type="text" id="page_stat_years" />
                        </div>
                        <div class="form-group">
                            <label>پروژه‌های موفق</label>
                            <input type="text" id="page_stat_projects" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>حریم خصوصی</label>
                        <input type="text" id="page_stat_privacy" />
                    </div>
                </div>

                <button class="btn-primary" onclick="savePages()"><i class="fas fa-save"></i> ذخیره صفحات</button>
                <span id="saveStatus" class="status-msg"></span>
            </div>

            <!-- ===== تب تنظیمات ===== -->
            <div id="tab-settings" class="tab-content">
                <h3>تنظیمات سایت</h3>
                <div class="form-group">
                    <label>نام سایت</label>
                    <input type="text" id="setting_site_name" />
                </div>
                <div class="form-group">
                    <label>شماره تماس</label>
                    <input type="text" id="setting_phone" />
                </div>
                <div class="form-group">
                    <label>ایمیل</label>
                    <input type="email" id="setting_email" />
                </div>
                <button class="btn-primary" onclick="saveSettings()"><i class="fas fa-save"></i> ذخیره تنظیمات</button>
                <span id="settingsStatus" class="status-msg"></span>
            </div>

            <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
        </div>

    </div>

    <script>
        const API_BASE = 'https://sofiaaisite.runflare.run';
        const ADMIN_PASSWORD_KEY = 'admin_password';
        const DEFAULT_PASSWORD = 'Ard$447100';

        function getAdminPassword() {
            let password = localStorage.getItem(ADMIN_PASSWORD_KEY);
            if (!password) { password = DEFAULT_PASSWORD; localStorage.setItem(ADMIN_PASSWORD_KEY, password); }
            return password;
        }

        // ===== ورود =====
        function checkLogin() {
            const input = document.getElementById('adminPassword').value;
            if (input === getAdminPassword()) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadPages();
                loadSettings();
            } else {
                document.getElementById('loginError').style.display = 'block';
                setTimeout(() => { document.getElementById('loginError').style.display = 'none'; }, 3000);
            }
        }

        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkLogin();
        });

        // ===== تب‌ها =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                document.getElementById('tab-' + this.dataset.tab).classList.add('active');
                if (this.dataset.tab === 'pages') loadPages();
                else if (this.dataset.tab === 'settings') loadSettings();
            });
        });

        // =============================================
        // ===== صفحات =====
        // =============================================
        function loadPages() {
            fetch(`${API_BASE}/api/admin/settings`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('page_hero_title').value = data.hero_title || '';
                    document.getElementById('page_hero_subtitle').value = data.hero_subtitle || '';
                    document.getElementById('page_hero_text').value = data.hero_text || '';
                    document.getElementById('page_about_title').value = data.about_title || '';
                    document.getElementById('page_about_text').value = data.about_text || '';
                    document.getElementById('page_footer_text').value = data.footer_text || '';
                    document.getElementById('page_copyright_text').value = data.copyright_text || '';
                    document.getElementById('page_stat_years').value = data.stat_years || '';
                    document.getElementById('page_stat_projects').value = data.stat_projects || '';
                    document.getElementById('page_stat_privacy').value = data.stat_privacy || '';
                })
                .catch(() => {
                    const status = document.getElementById('saveStatus');
                    status.textContent = '❌ خطا در دریافت صفحات';
                    status.className = 'status-msg error';
                });
        }

        function savePages() {
            const status = document.getElementById('saveStatus');
            status.textContent = '⏳ در حال ذخیره...';
            status.className = 'status-msg loading';

            const data = {
                hero_title: document.getElementById('page_hero_title').value,
                hero_subtitle: document.getElementById('page_hero_subtitle').value,
                hero_text: document.getElementById('page_hero_text').value,
                about_title: document.getElementById('page_about_title').value,
                about_text: document.getElementById('page_about_text').value,
                footer_text: document.getElementById('page_footer_text').value,
                copyright_text: document.getElementById('page_copyright_text').value,
                stat_years: document.getElementById('page_stat_years').value,
                stat_projects: document.getElementById('page_stat_projects').value,
                stat_privacy: document.getElementById('page_stat_privacy').value
            };

            console.log('📤 ارسال داده:', data);

            fetch(`${API_BASE}/api/admin/settings`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => {
                console.log('📥 وضعیت:', res.status);
                return res.json();
            })
            .then(result => {
                console.log('✅ نتیجه:', result);
                status.textContent = '✅ ' + (result.message || 'ذخیره شد!');
                status.className = 'status-msg success';
                loadPages(); // بارگذاری مجدد برای نمایش داده‌های جدید
            })
            .catch(err => {
                console.error('❌ خطا:', err);
                status.textContent = '❌ خطا در ذخیره';
                status.className = 'status-msg error';
            });
        }

        // =============================================
        // ===== تنظیمات =====
        // =============================================
        function loadSettings() {
            fetch(`${API_BASE}/api/admin/settings`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('setting_site_name').value = data.site_name || '';
                    document.getElementById('setting_phone').value = data.phone || '';
                    document.getElementById('setting_email').value = data.email || '';
                })
                .catch(() => {});
        }

        function saveSettings() {
            const status = document.getElementById('settingsStatus');
            status.textContent = '⏳ در حال ذخیره...';
            status.className = 'status-msg loading';

            const data = {
                site_name: document.getElementById('setting_site_name').value,
                phone: document.getElementById('setting_phone').value,
                email: document.getElementById('setting_email').value
            };

            fetch(`${API_BASE}/api/admin/settings`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                status.textContent = '✅ ' + (result.message || 'ذخیره شد!');
                status.className = 'status-msg success';
                loadSettings();
            })
            .catch(() => {
                status.textContent = '❌ خطا در ذخیره';
                status.className = 'status-msg error';
            });
        }
    </script>

</body>
</html>
