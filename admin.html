<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پنل مدیریت | سوفیا AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Vazirmatn', sans-serif; background: #f0f2f5; direction: rtl; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; border: 2px solid #FFB800; }
        .login-box { max-width: 400px; margin: 50px auto; padding: 30px; background: #fff; border-radius: 16px; border: 2px solid #6C3CE1; text-align: center; }
        .login-box input { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #ddd; font-size: 1rem; margin-bottom: 12px; font-family: 'Vazirmatn', sans-serif; }
        .login-box button { width: 100%; padding: 12px; background: #6C3CE1; color: #fff; border: none; border-radius: 30px; font-weight: 700; cursor: pointer; font-family: 'Vazirmatn', sans-serif; }
        .login-box .error { color: #e74c3c; margin-top: 10px; display: none; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #333; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; border-radius: 10px; border: 2px solid #ddd; font-size: 1rem; font-family: 'Vazirmatn', sans-serif; }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .btn-primary { background: #6C3CE1; color: #fff; border: none; padding: 12px 35px; border-radius: 30px; font-weight: 700; cursor: pointer; font-family: 'Vazirmatn', sans-serif; font-size: 1rem; }
        .btn-primary:hover { background: #4A1F9E; transform: scale(1.02); }
        .btn-danger { background: #e74c3c; color: #fff; border: none; padding: 6px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; font-family: 'Vazirmatn', sans-serif; font-size: 0.8rem; }
        .btn-danger:hover { background: #c0392b; }
        .btn-success { background: #28a745; color: #fff; border: none; padding: 6px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; font-family: 'Vazirmatn', sans-serif; font-size: 0.8rem; }
        .btn-success:hover { background: #1e7e34; }
        .back-link { display: inline-block; margin-top: 20px; color: #6C3CE1; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
        .status-msg { display: inline-block; margin-right: 16px; font-weight: 600; }
        .status-msg.success { color: #28a745; }
        .status-msg.error { color: #e74c3c; }
        .status-msg.loading { color: #f39c12; }
        .tabs { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; border-bottom: 2px solid #e8ecf1; padding-bottom: 12px; }
        .tab-btn { padding: 10px 24px; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; font-family: 'Vazirmatn', sans-serif; background: transparent; color: #5A4A7A; transition: 0.3s; }
        .tab-btn:hover { background: rgba(108,60,225,0.06); color: #6C3CE1; }
        .tab-btn.active { background: #6C3CE1; color: #fff; }
        .tab-content { display: none; background: #f8f9fc; padding: 20px; border-radius: 12px; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #6C3CE1; color: #fff; padding: 10px 14px; text-align: right; }
        td { padding: 10px 14px; border-bottom: 1px solid #ddd; }
        tr:hover { background: #f5f0ff; }
        .badge { display: inline-block; padding: 2px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-approved { background: #d4edda; color: #155724; }
        .badge-rejected { background: #f8d7da; color: #721c24; }
        .badge-draft { background: #e8ecf1; color: #5A4A7A; }
        .badge-published { background: #d4edda; color: #155724; }
        .loading { text-align: center; padding: 30px; color: #7a7a9a; }
        .empty { text-align: center; padding: 30px; color: #7a7a9a; }
        .table-responsive { overflow-x: auto; }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== ورود ===== -->
        <div id="loginPage" class="login-box">
            <h2>🔐 پنل مدیریت</h2>
            <p style="color:#7a7a9a;">رمز عبور را وارد کنید</p>
            <input type="password" id="adminPassword" placeholder="رمز عبور..." />
            <button onclick="checkLogin()">ورود</button>
            <div id="loginError" class="error">❌ رمز عبور اشتباه است!</div>
        </div>

        <!-- ===== پنل ===== -->
        <div id="adminPanel" style="display:none;">

            <h2 style="border-bottom:2px solid #FFB800; padding-bottom:12px;">📋 پنل مدیریت</h2>

            <div class="tabs">
                <button class="tab-btn active" data-tab="pages">📄 صفحات</button>
                <button class="tab-btn" data-tab="articles">📝 مقالات</button>
                <button class="tab-btn" data-tab="comments">💬 نظرات</button>
                <button class="tab-btn" data-tab="settings">⚙️ تنظیمات</button>
            </div>

            <!-- ===== تب صفحات ===== -->
            <div id="tab-pages" class="tab-content active">
                <h3>مدیریت صفحات</h3>

                <div style="border-bottom:1px solid #ddd; padding-bottom:16px; margin-bottom:16px;">
                    <h4 style="color:#6C3CE1;">🏠 صفحه اصلی</h4>
                    <div class="form-group">
                        <label>عنوان اصلی</label>
                        <input type="text" id="page_hero_title" />
                    </div>
                    <div class="form-group">
                        <label>زیر عنوان</label>
                        <input type="text" id="page_hero_subtitle" />
                    </div>
                    <div class="form-group">
                        <label>متن توصیفی</label>
                        <textarea id="page_hero_text" rows="3"></textarea>
                    </div>
                </div>

                <div style="border-bottom:1px solid #ddd; padding-bottom:16px; margin-bottom:16px;">
                    <h4 style="color:#6C3CE1;">📖 درباره ما</h4>
                    <div class="form-group">
                        <label>عنوان</label>
                        <input type="text" id="page_about_title" />
                    </div>
                    <div class="form-group">
                        <label>متن درباره ما</label>
                        <textarea id="page_about_text" rows="5"></textarea>
                    </div>
                </div>

                <div style="border-bottom:1px solid #ddd; padding-bottom:16px; margin-bottom:16px;">
                    <h4 style="color:#6C3CE1;">📌 فوتر</h4>
                    <div class="form-group">
                        <label>متن فوتر</label>
                        <input type="text" id="page_footer_text" />
                    </div>
                    <div class="form-group">
                        <label>متن کپی‌رایت</label>
                        <input type="text" id="page_copyright_text" />
                    </div>
                </div>

                <button class="btn-primary" onclick="savePages()"><i class="fas fa-save"></i> ذخیره صفحات</button>
                <span id="saveStatus" class="status-msg"></span>
            </div>

            <!-- ===== تب مقالات ===== -->
            <div id="tab-articles" class="tab-content">
                <h3>مدیریت مقالات</h3>
                <button class="btn-primary" onclick="showAddArticle()" style="margin-bottom:12px;"><i class="fas fa-plus"></i> مقاله جدید</button>
                <div id="articlesList"><div class="loading">در حال بارگذاری...</div></div>
            </div>

            <!-- ===== تب نظرات ===== -->
            <div id="tab-comments" class="tab-content">
                <h3>مدیریت نظرات</h3>
                <div id="commentsList"><div class="loading">در حال بارگذاری...</div></div>
            </div>

            <!-- ===== تب تنظیمات ===== -->
            <div id="tab-settings" class="tab-content">
                <h3>تنظیمات سایت</h3>
                <div class="form-group">
                    <label>نام سایت</label>
                    <input type="text" id="setting_site_name" />
                </div>
                <div class="form-group">
                    <label>شماره تماس</label>
                    <input type="text" id="setting_phone" />
                </div>
                <div class="form-group">
                    <label>ایمیل</label>
                    <input type="email" id="setting_email" />
                </div>
                <button class="btn-primary" onclick="saveSettings()"><i class="fas fa-save"></i> ذخیره تنظیمات</button>
                <span id="settingsStatus" class="status-msg"></span>
            </div>

            <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
        </div>

    </div>

    <!-- ===== مودال مقاله ===== -->
    <div class="modal" id="articleModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(4px); z-index:999; justify-content:center; align-items:center;">
        <div style="background:#fff; padding:30px; border-radius:16px; max-width:600px; width:90%; border:2px solid #FFB800; max-height:90vh; overflow-y:auto;">
            <h3 id="articleModalTitle">✍️ مقاله جدید</h3>
            <input type="hidden" id="articleEditId" />
            <div class="form-group">
                <label>عنوان</label>
                <input type="text" id="articleTitle" />
            </div>
            <div class="form-group">
                <label>دسته‌بندی</label>
                <select id="articleCategory">
                    <option value="هوش مصنوعی">هوش مصنوعی</option>
                    <option value="دستیار هوشمند">دستیار هوشمند</option>
                    <option value="ایجنت AI">ایجنت AI</option>
                    <option value="آموزش">آموزش</option>
                </select>
            </div>
            <div class="form-group">
                <label>متن</label>
                <textarea id="articleContent" rows="6"></textarea>
            </div>
            <div class="form-group">
                <label>نویسنده</label>
                <input type="text" id="articleAuthor" value="سوفیا AI" />
            </div>
            <div class="form-group">
                <label>وضعیت</label>
                <select id="articleStatus">
                    <option value="draft">پیش‌نویس</option>
                    <option value="published" selected>منتشر شده</option>
                </select>
            </div>
            <div style="display:flex; gap:12px; margin-top:16px;">
                <button class="btn-primary" onclick="saveArticle()">💾 ذخیره</button>
                <button class="btn-danger" onclick="closeArticleModal()">انصراف</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://sofiaaisite.runflare.run';
        const ADMIN_PASSWORD_KEY = 'admin_password';
        const DEFAULT_PASSWORD = 'Ard$447100';

        function getAdminPassword() {
            let password = localStorage.getItem(ADMIN_PASSWORD_KEY);
            if (!password) { password = DEFAULT_PASSWORD; localStorage.setItem(ADMIN_PASSWORD_KEY, password); }
            return password;
        }

        // ===== ورود =====
        function checkLogin() {
            const input = document.getElementById('adminPassword').value;
            if (input === getAdminPassword()) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadAllTabs();
            } else {
                document.getElementById('loginError').style.display = 'block';
                setTimeout(() => { document.getElementById('loginError').style.display = 'none'; }, 3000);
            }
        }

        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkLogin();
        });

        // ===== تب‌ها =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                document.getElementById('tab-' + this.dataset.tab).classList.add('active');
                loadTabContent(this.dataset.tab);
            });
        });

        function loadTabContent(tab) {
            if (tab === 'pages') loadPages();
            else if (tab === 'articles') loadArticles();
            else if (tab === 'comments') loadComments();
            else if (tab === 'settings') loadSettings();
        }

        function loadAllTabs() {
            loadPages();
            loadArticles();
            loadComments();
            loadSettings();
        }

        // =============================================
        // ===== صفحات =====
        // =============================================
        function loadPages() {
            fetch(`${API_BASE}/api/admin/settings`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('page_hero_title').value = data.hero_title || '';
                    document.getElementById('page_hero_subtitle').value = data.hero_subtitle || '';
                    document.getElementById('page_hero_text').value = data.hero_text || '';
                    document.getElementById('page_about_title').value = data.about_title || '';
                    document.getElementById('page_about_text').value = data.about_text || '';
                    document.getElementById('page_footer_text').value = data.footer_text || '';
                    document.getElementById('page_copyright_text').value = data.copyright_text || '';
                })
                .catch(() => {});
        }

        function savePages() {
            const status = document.getElementById('saveStatus');
            status.textContent = '⏳ در حال ذخیره...';
            status.className = 'status-msg loading';

            const data = {
                hero_title: document.getElementById('page_hero_title').value || '',
                hero_subtitle: document.getElementById('page_hero_subtitle').value || '',
                hero_text: document.getElementById('page_hero_text').value || '',
                about_title: document.getElementById('page_about_title').value || '',
                about_text: document.getElementById('page_about_text').value || '',
                footer_text: document.getElementById('page_footer_text').value || '',
                copyright_text: document.getElementById('page_copyright_text').value || ''
            };

            fetch(`${API_BASE}/api/admin/settings`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                status.textContent = '✅ ' + (result.message || 'ذخیره شد!');
                status.className = 'status-msg success';
                loadPages();
            })
            .catch(() => {
                status.textContent = '❌ خطا در ذخیره';
                status.className = 'status-msg error';
            });
        }

        // =============================================
        // ===== مقالات =====
        // =============================================
        function loadArticles() {
            const container = document.getElementById('articlesList');
            container.innerHTML = '<div class="loading">در حال بارگذاری...</div>';

            fetch(`${API_BASE}/api/admin/articles`)
                .then(res => res.json())
                .then(data => {
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty">هیچ مقاله‌ای وجود ندارد.</div>';
                        return;
                    }
                    let html = `<div class="table-responsive"><table><thead><tr>
                        <th>#</th><th>عنوان</th><th>دسته‌بندی</th><th>نویسنده</th><th>وضعیت</th><th>عملیات</th>
                    </tr></thead><tbody>`;
                    data.forEach((item, index) => {
                        const statusBadge = item.status === 'published' ? 'badge-published' : 'badge-draft';
                        const statusText = item.status === 'published' ? 'منتشر شده' : 'پیش‌نویس';
                        html += `<tr>
                            <td>${index+1}</td>
                            <td>${item.title}</td>
                            <td>${item.category}</td>
                            <td>${item.author}</td>
                            <td><span class="badge ${statusBadge}">${statusText}</span></td>
                            <td>
                                <button class="btn-success" onclick="editArticle(${item.id})"><i class="fas fa-edit"></i> ویرایش</button>
                                <button class="btn-danger" onclick="deleteArticle(${item.id})"><i class="fas fa-trash-alt"></i> حذف</button>
                            </td>
                        </tr>`;
                    });
                    html += `</tbody></table></div>`;
                    container.innerHTML = html;
                })
                .catch(() => { container.innerHTML = '<div class="empty">خطا در دریافت اطلاعات.</div>'; });
        }

        function showAddArticle() {
            document.getElementById('articleModal').style.display = 'flex';
            document.getElementById('articleModalTitle').textContent = '✍️ مقاله جدید';
            document.getElementById('articleEditId').value = '';
            document.getElementById('articleTitle').value = '';
            document.getElementById('articleCategory').value = 'هوش مصنوعی';
            document.getElementById('articleContent').value = '';
            document.getElementById('articleAuthor').value = 'سوفیا AI';
            document.getElementById('articleStatus').value = 'published';
        }

        function editArticle(id) {
            fetch(`${API_BASE}/api/articles/${id}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('articleModal').style.display = 'flex';
                    document.getElementById('articleModalTitle').textContent = '✍️ ویرایش مقاله';
                    document.getElementById('articleEditId').value = id;
                    document.getElementById('articleTitle').value = data.title;
                    document.getElementById('articleCategory').value = data.category;
                    document.getElementById('articleContent').value = data.content;
                    document.getElementById('articleAuthor').value = data.author;
                    document.getElementById('articleStatus').value = data.status || 'draft';
                })
                .catch(() => alert('❌ خطا'));
        }

        function closeArticleModal() {
            document.getElementById('articleModal').style.display = 'none';
        }

        function saveArticle() {
            const id = document.getElementById('articleEditId').value;
            const data = {
                title: document.getElementById('articleTitle').value,
                category: document.getElementById('articleCategory').value,
                content: document.getElementById('articleContent').value,
                author: document.getElementById('articleAuthor').value || 'سوفیا AI',
                status: document.getElementById('articleStatus').value
            };

            const url = id ? `${API_BASE}/api/admin/articles/${id}` : `${API_BASE}/api/admin/articles`;
            const method = id ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                alert(result.message || '✅ ذخیره شد!');
                closeArticleModal();
                loadArticles();
            })
            .catch(() => alert('❌ خطا در ذخیره'));
        }

        function deleteArticle(id) {
            if (!confirm('آیا از حذف این مقاله اطمینان دارید؟')) return;
            fetch(`${API_BASE}/api/admin/articles/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(() => {
                    alert('✅ مقاله حذف شد!');
                    loadArticles();
                })
                .catch(() => alert('❌ خطا در حذف'));
        }

        // =============================================
        // ===== نظرات =====
        // =============================================
        function loadComments() {
            const container = document.getElementById('commentsList');
            container.innerHTML = '<div class="loading">در حال بارگذاری...</div>';

            fetch(`${API_BASE}/api/admin/comments`)
                .then(res => res.json())
                .then(data => {
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty">هیچ نظری وجود ندارد.</div>';
                        return;
                    }
                    let html = `<div class="table-responsive"><table><thead><tr>
                        <th>#</th><th>نام</th><th>ایمیل</th><th>متن</th><th>وضعیت</th><th>عملیات</th>
                    </tr></thead><tbody>`;
                    data.forEach((item, index) => {
                        const statusMap = {
                            'pending': '<span class="badge badge-pending">در انتظار تایید</span>',
                            'approved': '<span class="badge badge-approved">تایید شده</span>',
                            'rejected': '<span class="badge badge-rejected">رد شده</span>'
                        };
                        html += `<tr>
                            <td>${index+1}</td>
                            <td>${item.name}</td>
                            <td>${item.email || '-'}</td>
                            <td style="max-width:200px; word-break:break-word;">${item.text}</td>
                            <td>${statusMap[item.status] || item.status}</td>
                            <td>
                                ${item.status === 'pending' ? `
                                    <button class="btn-success" onclick="approveComment(${item.id})"><i class="fas fa-check"></i> تایید</button>
                                    <button class="btn-danger" onclick="rejectComment(${item.id})"><i class="fas fa-times"></i> رد</button>
                                ` : `
                                    <button class="btn-danger" onclick="deleteComment(${item.id})"><i class="fas fa-trash-alt"></i> حذف</button>
                                `}
                            </td>
                        </tr>`;
                    });
                    html += `</tbody></table></div>`;
                    container.innerHTML = html;
                })
                .catch(() => { container.innerHTML = '<div class="empty">خطا در دریافت اطلاعات.</div>'; });
        }

        function approveComment(id) {
            fetch(`${API_BASE}/api/admin/comments/${id}/approve`, { method: 'PUT' })
                .then(res => res.json())
                .then(() => { alert('✅ نظر تایید شد!'); loadComments(); })
                .catch(() => alert('❌ خطا'));
        }

        function rejectComment(id) {
            if (!confirm('آیا از رد این نظر اطمینان دارید؟')) return;
            fetch(`${API_BASE}/api/admin/comments/${id}/reject`, { method: 'PUT' })
                .then(res => res.json())
                .then(() => { alert('✅ نظر رد شد!'); loadComments(); })
                .catch(() => alert('❌ خطا'));
        }

        function deleteComment(id) {
            if (!confirm('آیا از حذف این نظر اطمینان دارید؟')) return;
            fetch(`${API_BASE}/api/admin/comments/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(() => { alert('✅ نظر حذف شد!'); loadComments(); })
                .catch(() => alert('❌ خطا'));
        }

        // =============================================
        // ===== تنظیمات =====
        // =============================================
        function loadSettings() {
            fetch(`${API_BASE}/api/admin/settings`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('setting_site_name').value = data.site_name || '';
                    document.getElementById('setting_phone').value = data.phone || '';
                    document.getElementById('setting_email').value = data.email || '';
                })
                .catch(() => {});
        }

        function saveSettings() {
            const status = document.getElementById('settingsStatus');
            status.textContent = '⏳ در حال ذخیره...';
            status.className = 'status-msg loading';

            const data = {
                site_name: document.getElementById('setting_site_name').value || '',
                phone: document.getElementById('setting_phone').value || '',
                email: document.getElementById('setting_email').value || ''
            };

            fetch(`${API_BASE}/api/admin/settings`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                status.textContent = '✅ ' + (result.message || 'ذخیره شد!');
                status.className = 'status-msg success';
                loadSettings();
            })
            .catch(() => {
                status.textContent = '❌ خطا در ذخیره';
                status.className = 'status-msg error';
            });
        }
    </script>

</body>
</html>
