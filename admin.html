<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پنل مدیریت | سوفیا AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #f0f2f5;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #6C3CE1;
        }
        h1 { text-align: center; color: #1A0F2E; margin-bottom: 20px; }
        h1 .highlight { color: #6C3CE1; }
        .login-box {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: #fff;
            border-radius: 16px;
            border: 2px solid #FFB800;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 1rem;
            font-family: 'Vazirmatn', sans-serif;
            margin-bottom: 12px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #6C3CE1;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 1rem;
        }
        .login-box button:hover { background: #4A1F9E; }
        .login-box .error { color: #e74c3c; margin-top: 10px; display: none; }
        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            background: #e8ecf1;
            color: #5A4A7A;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #6C3CE1;
            color: #fff;
        }
        .tab-content {
            display: none;
            background: #f8f9fc;
            padding: 20px;
            border-radius: 12px;
        }
        .tab-content.active { display: block; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
        }
        th {
            background: #6C3CE1;
            color: #fff;
            padding: 12px 16px;
            text-align: right;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
        }
        tr:hover { background: #f5f0ff; }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-approved { background: #d4edda; color: #155724; }
        .badge-rejected { background: #f8d7da; color: #721c24; }
        .btn-approve {
            background: #28a745;
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
        }
        .btn-approve:hover { background: #1e7e34; }
        .btn-danger {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
        }
        .btn-danger:hover { background: #c0392b; }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #6C3CE1;
            text-decoration: none;
            font-weight: 600;
        }
        .loading { text-align: center; padding: 40px; color: #7a7a9a; }
        .empty { text-align: center; padding: 40px; color: #7a7a9a; }
    </style>
</head>
<body>

    <!-- ===== صفحه ورود ===== -->
    <div id="loginPage" class="login-box">
        <h2 style="text-align:center;">🔐 پنل مدیریت</h2>
        <p style="color:#7a7a9a; text-align:center; margin-bottom:16px;">رمز عبور را وارد کنید</p>
        <input type="password" id="adminPassword" placeholder="رمز عبور..." />
        <button onclick="checkLogin()">ورود</button>
        <div id="loginError" class="error">❌ رمز عبور اشتباه است!</div>
    </div>

    <!-- ===== پنل مدیریت ===== -->
    <div class="container" id="adminPanel" style="display:none;">
        <h1>📋 <span class="highlight">پنل مدیریت</span></h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('comments')">💬 نظرات</button>
            <button class="tab-btn" onclick="showTab('users')">👥 کاربران</button>
        </div>

        <div id="tab-comments" class="tab-content active">
            <h3>💬 مدیریت نظرات</h3>
            <div id="commentsList"><div class="loading">⏳ در حال بارگذاری...</div></div>
        </div>

        <div id="tab-users" class="tab-content">
            <h3>👥 لیست کاربران</h3>
            <div id="usersList"><div class="loading">⏳ در حال بارگذاری...</div></div>
        </div>

        <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
    </div>

    <script>
        // ===== رمز عبور =====
        const ADMIN_PASSWORD = 'Ard$447100';

        function checkLogin() {
            const input = document.getElementById('adminPassword').value;
            if (input === ADMIN_PASSWORD) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadComments();
                loadUsers();
            } else {
                document.getElementById('loginError').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('loginError').style.display = 'none';
                }, 3000);
            }
        }

        // ===== مدیریت تب‌ها =====
        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            if (tab === 'comments') loadComments();
            else if (tab === 'users') loadUsers();
        }

        // ===== بارگذاری نظرات =====
        function loadComments() {
            const container = document.getElementById('commentsList');
            container.innerHTML = '<div class="loading">⏳ در حال بارگذاری...</div>';

            fetch('/api/admin/comments')
                .then(response => {
                    if (!response.ok) throw new Error('خطا در دریافت اطلاعات');
                    return response.json();
                })
                .then(data => {
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty">❌ هیچ نظری وجود ندارد.</div>';
                        return;
                    }
                    let html = `
                        <table>
                            <thead><tr>
                                <th>#</th>
                                <th>نام</th>
                                <th>ایمیل</th>
                                <th>متن</th>
                                <th>وضعیت</th>
                                <th>عملیات</th>
                            </tr></thead>
                            <tbody>
                    `;
                    data.forEach((item, index) => {
                        const statusMap = {
                            'pending': '<span class="badge badge-pending">در انتظار تایید</span>',
                            'approved': '<span class="badge badge-approved">تایید شده</span>',
                            'rejected': '<span class="badge badge-rejected">رد شده</span>'
                        };
                        html += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${item.name}</td>
                                <td>${item.email || '-'}</td>
                                <td style="max-width:200px; word-break:break-word;">${item.text}</td>
                                <td>${statusMap[item.status] || item.status}</td>
                                <td>
                                    ${item.status === 'pending' ? `
                                        <button class="btn-approve" onclick="approveComment(${item.id})">✅ تایید</button>
                                        <button class="btn-danger" onclick="rejectComment(${item.id})">❌ رد</button>
                                    ` : `
                                        <button class="btn-danger" onclick="deleteComment(${item.id})">🗑️ حذف</button>
                                    `}
                                </td>
                            </tr>
                        `;
                    });
                    html += `</tbody></table>`;
                    container.innerHTML = html;
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    container.innerHTML = '<div class="empty">❌ خطا در دریافت اطلاعات. لطفاً صفحه را مجدداً بارگذاری کنید.</div>';
                });
        }

        // ===== تایید نظر =====
        function approveComment(id) {
            fetch(`/api/admin/comments/${id}/approve`, { method: 'PUT' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    loadComments();
                })
                .catch(() => alert('❌ خطا در تایید نظر'));
        }

        // ===== رد نظر =====
        function rejectComment(id) {
            if (!confirm('آیا از رد این نظر اطمینان دارید؟')) return;
            fetch(`/api/admin/comments/${id}/reject`, { method: 'PUT' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    loadComments();
                })
                .catch(() => alert('❌ خطا در رد نظر'));
        }

        // ===== حذف نظر =====
        function deleteComment(id) {
            if (!confirm('آیا از حذف این نظر اطمینان دارید؟')) return;
            fetch(`/api/admin/comments/${id}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    loadComments();
                })
                .catch(() => alert('❌ خطا در حذف نظر'));
        }

        // ===== بارگذاری کاربران =====
        function loadUsers() {
            const container = document.getElementById('usersList');
            container.innerHTML = '<div class="loading">⏳ در حال بارگذاری...</div>';

            fetch('/api/users')
                .then(response => response.json())
                .then(data => {
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty">❌ هیچ کاربری ثبت‌نام نکرده است.</div>';
                        return;
                    }
                    let html = `
                        <table>
                            <thead><tr>
                                <th>#</th>
                                <th>نام</th>
                                <th>ایمیل</th>
                                <th>شماره تماس</th>
                                <th>تاریخ ثبت‌نام</th>
                            </tr></thead>
                            <tbody>
                    `;
                    data.forEach((user, index) => {
                        html += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${user.name}</td>
                                <td>${user.email}</td>
                                <td>${user.phone || '-'}</td>
                                <td>${user.created_at}</td>
                            </tr>
                        `;
                    });
                    html += `</tbody></table>`;
                    container.innerHTML = html;
                })
                .catch(() => {
                    container.innerHTML = '<div class="empty">❌ خطا در دریافت اطلاعات کاربران.</div>';
                });
        }

        // ===== ورود با کلید Enter =====
        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkLogin();
        });
    </script>

</body>
</html>
