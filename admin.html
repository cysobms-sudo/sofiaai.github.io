<script>
// ===== تنظیمات =====
const ADMIN_PASSWORD = "123456"; // رمز عبور پیش‌فرض - حتماً تغییر دهید!

// ===== توابع ورود =====
function checkLogin() {
    const passwordInput = document.getElementById('adminPassword');
    const errorDiv = document.getElementById('loginError');
    const password = passwordInput.value.trim();
    
    if (password === ADMIN_PASSWORD) {
        errorDiv.style.display = 'none';
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadData(); // بارگذاری داده‌ها
        showToast('✅ ورود موفق!', 'success');
    } else {
        errorDiv.style.display = 'block';
        passwordInput.value = '';
        passwordInput.focus();
        showToast('❌ رمز عبور اشتباه است!', 'error');
    }
}

// ===== ورود با کلید Enter =====
document.addEventListener('DOMContentLoaded', function() {
    const passwordInput = document.getElementById('adminPassword');
    if (passwordInput) {
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkLogin();
            }
        });
    }
    
    // فعال‌سازی تب‌ها
    initTabs();
    
    // بارگذاری تنظیمات رنگ
    loadColorSettings();
});

// ===== خروج =====
function logout() {
    if (confirm('آیا مطمئن هستید؟')) {
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('loginPage').style.display = 'block';
        document.getElementById('adminPassword').value = '';
        document.getElementById('loginError').style.display = 'none';
        showToast('👋 خروج انجام شد', 'info');
    }
}

// ===== نمایش پیام =====
function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.style.cssText = `
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        padding: 16px 24px; border-radius: 12px; z-index: 9999;
        font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        animation: slideDown 0.5s ease;
        background: ${type === 'success' ? '#28a745' : type === 'error' ? '#e74c3c' : '#3498db'};
        color: #fff; font-family: 'Vazirmatn', sans-serif;
        min-width: 200px; text-align: center;
    `;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'slideUp 0.5s ease';
        setTimeout(() => toast.remove(), 500);
    }, 3000);
}

// ===== استایل انیمیشن =====
const style = document.createElement('style');
style.textContent = `
    @keyframes slideDown {
        from { opacity: 0; transform: translateX(-50%) translateY(-100px); }
        to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    @keyframes slideUp {
        from { opacity: 1; transform: translateX(-50%) translateY(0); }
        to { opacity: 0; transform: translateX(-50%) translateY(-100px); }
    }
`;
document.head.appendChild(style);

// ===== فعال‌سازی تب‌ها =====
function initTabs() {
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => {
        tab.addEventListener('click', function() {
            // حذف active از همه تب‌ها
            tabs.forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            
            // مخفی کردن همه محتواها
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            // نمایش محتوای مربوطه
            const tabId = this.dataset.tab;
            const target = document.getElementById(`tab-${tabId}`);
            if (target) {
                target.classList.add('active');
                // بارگذاری داده‌های مربوط به تب
                loadTabData(tabId);
            }
        });
    });
}

// ===== بارگذاری داده‌های تب =====
function loadTabData(tabId) {
    switch(tabId) {
        case 'dashboard':
            updateDashboardStats();
            break;
        case 'pages':
            loadPagesData();
            break;
        case 'gallery':
            loadGallery();
            break;
        case 'articles':
            loadArticles();
            break;
        case 'comments':
            loadComments();
            break;
        case 'users':
            loadUsers();
            break;
        case 'requests':
            loadRequests();
            break;
        case 'cart':
            loadCart();
            break;
        case 'settings':
            loadSettings();
            break;
    }
}

// ===== بارگذاری اولیه داده‌ها =====
function loadData() {
    updateDashboardStats();
    loadPagesData();
    loadGallery();
    loadArticles();
    loadComments();
    loadUsers();
    loadRequests();
    loadCart();
    loadSettings();
}

// ===== آمار داشبورد =====
function updateDashboardStats() {
    const data = getMockData();
    document.getElementById('statsArticles').textContent = data.articles.length;
    document.getElementById('statsComments').textContent = data.comments.length;
    document.getElementById('statsPending').textContent = data.requests.filter(r => r.status === 'pending').length;
    document.getElementById('statsUsers').textContent = data.users.length;
    document.getElementById('statsRequests').textContent = data.requests.length;
    document.getElementById('statsCart').textContent = data.cart.length;
    document.getElementById('statsGallery').textContent = data.gallery.length;
}

// ===== دیتای آزمایشی =====
function getMockData() {
    return {

            { id: 2, title: 'چت‌بات‌های پیشرفته', category: 'دستیار هوشمند', status: 'draft', author: 'سوفیا AI' }
        ],
        comments: [
            { id: 1, name: 'احمد رضایی', text: 'مقاله عالی بود!', status: 'approved', date: '1405-04-15' },
            { id: 2, name: 'سارا محمدی', text: 'خیلی مفید بود ممنون', status: 'pending', date: '1405-04-14' }
        ],
        users: [
            { id: 1, name: 'علی کریمی', email: 'ali@email.com', role: 'user', date: '1405-01-10' },
            { id: 2, name: 'مریم احمدی', email: 'maryam@email.com', role: 'admin', date: '1405-01-05' }
        ],
        requests: [
            { id: 1, user: 'رضا نوری', subject: 'مشاوره هوش مصنوعی', status: 'pending', date: '1405-04-16' },
            { id: 2, user: 'زهرا حسینی', subject: 'سفارش پروژه', status: 'approved', date: '1405-04-15' }
        ],
        cart: [
            { id: 1, user: 'محمد رضایی', items: 3, total: '۲,۵۰۰,۰۰۰ تومان', date: '1405-04-16' },
            { id: 2, user: 'نگار محمدی', items: 1, total: '۸۵۰,۰۰۰ تومان', date: '1405-04-15' }
        ],
        gallery: [
            { id: 1, title: 'لوگوی سوفیا', description: 'لوگوی رسمی', image: '/images/logo.png' },
            { id: 2, title: 'تیم سوفیا', description: 'تیم توسعه', image: '/images/team.jpg' }
        ]
    };
}

// ===== مدیریت صفحات =====
function loadPagesData() {
    // بارگذاری داده‌های صفحات (از localStorage یا دیتای پیش‌فرض)
    const pages = JSON.parse(localStorage.getItem('sophia_pages')) || {
        hero_title: 'سوفیا AI - دستیار هوشمند شما',
        hero_subtitle: 'قدرت هوش مصنوعی در اختیار شما',
        hero_text: 'با سوفیا، آینده را امروز تجربه کنید',
        about_title: 'درباره سوفیا',
        about_text: 'سوفیا یک پلتفرم پیشرفته هوش مصنوعی است...',
        about_image: '/images/about.jpg',
        footer_text: 'سوفیا AI - دستیار هوشمند',
        copyright_text: '© ۱۴۰۵ تمامی حقوق محفوظ است',
        stat_years: '۵+ سال سابقه',
        stat_projects: '۱۰۰+ پروژه موفق',
        stat_privacy: 'حریم خصوصی کاربران'
    };
    
    document.getElementById('page_hero_title').value = pages.hero_title || '';
    document.getElementById('page_hero_subtitle').value = pages.hero_subtitle || '';
    document.getElementById('page_hero_text').value = pages.hero_text || '';
    document.getElementById('page_about_title').value = pages.about_title || '';
    document.getElementById('page_about_text').value = pages.about_text || '';
    document.getElementById('page_about_image').value = pages.about_image || '';
    document.getElementById('page_footer_text').value = pages.footer_text || '';
    document.getElementById('page_copyright_text').value = pages.copyright_text || '';
    document.getElementById('page_stat_years').value = pages.stat_years || '';
    document.getElementById('page_stat_projects').value = pages.stat_projects || '';
    document.getElementById('page_stat_privacy').value = pages.stat_privacy || '';
}

function savePages() {
    const pages = {
        hero_title: document.getElementById('page_hero_title').value,
        hero_subtitle: document.getElementById('page_hero_subtitle').value,
        hero_text: document.getElementById('page_hero_text').value,
        about_title: document.getElementById('page_about_title').value,
        about_text: document.getElementById('page_about_text').value,
        about_image: document.getElementById('page_about_image').value,
        footer_text: document.getElementById('page_footer_text').value,
        copyright_text: document.getElementById('page_copyright_text').value,
        stat_years: document.getElementById('page_stat_years').value,
        stat_projects: document.getElementById('page_stat_projects').value,
        stat_privacy: document.getElementById('page_stat_privacy').value
    };
    
    localStorage.setItem('sophia_pages', JSON.stringify(pages));
    const status = document.getElementById('saveStatus');
    status.textContent = '✅ ذخیره شد!';
    status.className = 'status-msg success';
    setTimeout(() => {
        status.textContent = '';
        status.className = 'status-msg';
    }, 3000);
    showToast('✅ صفحات با موفقیت ذخیره شدند', 'success');
}

// ===== مدیریت گالری =====
function loadGallery() {
    const gallery = JSON.parse(localStorage.getItem('sophia_gallery')) || getMockData().gallery;
    renderGallery(gallery);
}

function renderGallery(gallery) {
    const container = document.getElementById('galleryList');
    if (!gallery || gallery.length === 0) {
        container.innerHTML = `<div class="empty"><i class="fas fa-images"></i>هیچ تصویری در گالری وجود ندارد</div>`;
        return;
    }
    
    let html = `<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:16px;">`;
    gallery.forEach((item, index) => {
        html += `
            <div style="background:var(--bg-light); border-radius:var(--radius); padding:12px; border:1px solid var(--border-color);">
                <img src="${item.image || '/images/placeholder.jpg'}" alt="${item.title}" 
                     style="width:100%; height:150px; object-fit:cover; border-radius:8px; background:#eee;" />
                <h4 style="margin:8px 0 4px;">${item.title}</h4>
                <p style="font-size:0.8rem; color:var(--text-muted);">${item.description || ''}</p>
                <button class="btn btn-danger btn-sm" onclick="deleteGalleryItem(${index})" style="margin-top:8px;">
                    <i class="fas fa-trash"></i> حذف
                </button>
            </div>
        `;
    });
    html += `</div>`;
    container.innerHTML = html;
}

function addGalleryItem() {
    const title = document.getElementById('gallery_title').value.trim();
    const description = document.getElementById('gallery_description').value.trim();
    const image = document.getElementById('gallery_image_url').value.trim();
    
    if (!title || !image) {
        showToast('❌ لطفاً عنوان و تصویر را وارد کنید', 'error');
        return;
    }
    
    const gallery = JSON.parse(localStorage.getItem('sophia_gallery')) || [];
    gallery.push({ id: Date.now(), title, description, image });
    localStorage.setItem('sophia_gallery', JSON.stringify(gallery));
    renderGallery(gallery);
    resetGalleryForm();
    showToast('✅ تصویر با موفقیت اضافه شد', 'success');
}

function deleteGalleryItem(index) {
    if (!confirm('آیا از حذف این تصویر مطمئن هستید؟')) return;
    const gallery = JSON.parse(localStorage.getItem('sophia_gallery')) || [];
    gallery.splice(index, 1);
    localStorage.setItem('sophia_gallery', JSON.stringify(gallery));
    renderGallery(gallery);
    showToast('🗑️ تصویر حذف شد', 'info');
}

function resetGalleryForm() {
    document.getElementById('gallery_title').value = '';
    document.getElementById('gallery_description').value = '';
    document.getElementById('gallery_image_url').value = '';
    document.getElementById('galleryFileInput').value = '';
    document.getElementById('galleryImagePreview').className = 'image-preview';
    document.getElementById('galleryImagePreview').src = '';
    document.getElementById('removeGalleryImageBtn').className = 'btn-remove-image';
}

// ===== آپلود تصویر گالری =====
document.addEventListener('DOMContentLoaded', function() {
    const fileInput = document.getElementById('galleryFileInput');
    if (fileInput) {
        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('galleryImagePreview');
                    preview.src = e.target.result;
                    preview.className = 'image-preview show';
                    document.getElementById('removeGalleryImageBtn').className = 'btn-remove-image show';
                    document.getElementById('gallery_image_url').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
    }
});

function removeGalleryImage() {
    document.getElementById('galleryFileInput').value = '';
    document.getElementById('galleryImagePreview').className = 'image-preview';
    document.getElementById('galleryImagePreview').src = '';
    document.getElementById('removeGalleryImageBtn').className = 'btn-remove-image';
    document.getElementById('gallery_image_url').value = '';
}

// ===== مدیریت مقالات =====
function loadArticles() {
    const articles = JSON.parse(localStorage.getItem('sophia_articles')) || getMockData().articles;
    renderArticles(articles);
}

function renderArticles(articles) {
    const container = document.getElementById('articlesList');
    if (!articles || articles.length === 0) {
        container.innerHTML = `<div class="empty"><i class="fas fa-newspaper"></i>هیچ مقاله‌ای وجود ندارد</div>`;
        return;
    }
    
    let html = `<div class="table-responsive"><table>
        <thead><tr><th>عنوان</th><th>دسته‌بندی</th><th>نویسنده</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>`;
    articles.forEach((article, index) => {
        html += `
            <tr>
                <td>${article.title}</td>
                <td>${article.category}</td>
                <td>${article.author}</td>
                <td><span class="badge ${article.status === 'published' ? 'badge-published' : 'badge-draft'}">${article.status === 'published' ? 'منتشر شده' : 'پیش‌نویس'}</span></td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick="editArticle(${index})"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-danger btn-sm" onclick="deleteArticle(${index})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `;
    });
    html += `</tbody></table></div>`;
    container.innerHTML = html;
}

function showAddArticle() {
    document.getElementById('articleEditId').value = '';
    document.getElementById('articleTitle').value = '';
    document.getElementById('articleCategory').value = 'هوش مصنوعی';
    document.getElementById('articleContent').value = '';
    document.getElementById('articleAuthor').value = 'سوفیا AI';
    document.getElementById('articleStatus').value = 'published';
    document.getElementById('articleModalTitle').textContent = '✍️ مقاله جدید';
    document.getElementById('articleModal').classList.add('active');
}

function editArticle(index) {
    const articles = JSON.parse(localStorage.getItem('sophia_articles')) || getMockData().articles;
    const article = articles[index];
    document.getElementById('articleEditId').value = index;
    document.getElementById('articleTitle').value = article.title;
    document.getElementById('articleCategory').value = article.category;
    document.getElementById('articleContent').value = article.content || '';
    document.getElementById('articleAuthor').value = article.author;
    document.getElementById('articleStatus').value = article.status;
    document.getElementById('articleModalTitle').textContent = '✏️ ویرایش مقاله';
    document.getElementById('articleModal').classList.add('active');
}

function saveArticle() {
    const id = document.getElementById('articleEditId').value;
    const title = document.getElementById('articleTitle').value.trim();
    const category = document.getElementById('articleCategory').value;
    const content = document.getElementById('articleContent').value.trim();
    const author = document.getElementById('articleAuthor').value.trim();
    const status = document.getElementById('articleStatus').value;
    
    if (!title || !content) {
        showToast('❌ عنوان و متن مقاله الزامی است', 'error');
        return;
    }
    
    let articles = JSON.parse(localStorage.getItem('sophia_articles')) || getMockData().articles;
    
    if (id === '') {
        // افزودن جدید
        articles.push({ id: Date.now(), title, category, content, author, status });
        showToast('✅ مقاله جدید اضافه شد', 'success');
    } else {
        // ویرایش
        articles[id] = { ...articles[id], title, category, content, author, status };
        showToast('✅ مقاله ویرایش شد', 'success');
    }
    
    localStorage.setItem('sophia_articles', JSON.stringify(articles));
    renderArticles(articles);
    closeArticleModal();
}

function deleteArticle(index) {
    if (!confirm('آیا از حذف این مقاله مطمئن هستید؟')) return;
    const articles = JSON.parse(localStorage.getItem('sophia_articles')) || [];
    articles.splice(index, 1);
    localStorage.setItem('sophia_articles', JSON.stringify(articles));
    renderArticles(articles);
    showToast('🗑️ مقاله حذف شد', 'info');
}

function closeArticleModal() {
    document.getElementById('articleModal').classList.remove('active');
}

// ===== مدیریت نظرات =====
function loadComments() {
    const comments = JSON.parse(localStorage.getItem('sophia_comments')) || getMockData().comments;
    renderComments(comments);
}

function renderComments(comments) {
    const container = document.getElementById('commentsList');
    if (!comments || comments.length === 0) {
        container.innerHTML = `<div class="empty"><i class="fas fa-comment-dots"></i>هیچ نظری وجود ندارد</div>`;
        return;
    }
    
    let html = `<div class="table-responsive"><table>
        <thead><tr><th>کاربر</th><th>متن</th><th>وضعیت</th><th>تاریخ</th><th>عملیات</th></tr></thead><tbody>`;
    comments.forEach((comment, index) => {
        html += `
            <tr>
                <td>${comment.name}</td>
                <td>${comment.text}</td>
                <td><span class="badge ${comment.status === 'approved' ? 'badge-approved' : 'badge-pending'}">${comment.status === 'approved' ? 'تایید شده' : 'در انتظار'}</span></td>
                <td>${comment.date}</td>
                <td>
                    ${comment.status === 'pending' ? `<button class="btn btn-success btn-sm" onclick="approveComment(${index})"><i class="fas fa-check"></i></button>` : ''}
                    <button class="btn btn-danger btn-sm" onclick="deleteComment(${index})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `;
    });
    html += `</tbody></table></div>`;
    container.innerHTML = html;
}

function approveComment(index) {
    const comments = JSON.parse(localStorage.getItem('sophia_comments')) || getMockData().comments;
    comments[index].status = 'approved';
    localStorage.setItem('sophia_comments', JSON.stringify(comments));
    renderComments(comments);
    showToast('✅ نظر تایید شد', 'success');
}

function deleteComment(index) {
    if (!confirm('آیا از حذف این نظر مطمئن هستید؟')) return;
    const comments = JSON.parse(localStorage.getItem('sophia_comments')) || [];
    comments.splice(index, 1);
    localStorage.setItem('sophia_comments', JSON.stringify(comments));
    renderComments(comments);
    showToast('🗑️ نظر حذف شد', 'info');
}

// ===== مدیریت کاربران =====
function loadUsers() {
    const users = JSON.parse(localStorage.getItem('sophia_users')) || getMockData().users;
    renderUsers(users);
}

function renderUsers(users) {
    const container = document.getElementById('usersList');
    if (!users || users.length === 0) {
        container.innerHTML = `<div class="empty"><i class="fas fa-users"></i>هیچ کاربری وجود ندارد</div>`;
        return;
    }
    
    let html = `<div class="table-responsive"><table>
        <thead><tr><th>نام</th><th>ایمیل</th><th>نقش</th><th>تاریخ عضویت</th><th>عملیات</th></tr></thead><tbody>`;
    users.forEach((user, index) => {
        html += `
            <tr>
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td><span class="badge ${user.role === 'admin' ? 'badge-approved' : 'badge-draft'}">${user.role === 'admin' ? 'مدیر' : 'کاربر'}</span></td>
                <td>${user.date}</td>
                <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteUser(${index})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `;
    });
    html += `</tbody></table></div>`;
    container.innerHTML = html;
}

function deleteUser(index) {
    if (!confirm('آیا از حذف این کاربر مطمئن هستید؟')) return;
    const users = JSON.parse(localStorage.getItem('sophia_users')) || [];
    users.splice(index, 1);
    localStorage.setItem('sophia_users', JSON.stringify(users));
    renderUsers(users);
    showToast('🗑️ کاربر حذف شد', 'info');
}

// ===== مدیریت درخواست‌ها =====
function loadRequests() {
    const requests = JSON.parse(localStorage.getItem('sophia_requests')) || getMockData().requests;
    renderRequests(requests);
}

function renderRequests(requests) {
    const container = document.getElementById('requestsList');
    if (!requests || requests.length === 0) {
        container.innerHTML = `<div class="empty"><i class="fas fa-clipboard-list"></i>هیچ درخواستی وجود ندارد</div>`;
        return;
    }
    
    let html = `<div class="table-responsive"><table>
        <thead><tr><th>کاربر</th><th>موضوع</th><th>وضعیت</th><th>تاریخ</th><th>عملیات</th></tr></thead><tbody>`;
    requests.forEach((req, index) => {
        html += `
            <tr>
                <td>${req.user}</td>
                <td>${req.subject}</td>
                <td><span class="badge ${req.status === 'approved' ? 'badge-approved' : req.status === 'rejected' ? 'badge-rejected' : 'badge-pending'}">${req.status === 'approved' ? 'تایید شده' : req.status === 'rejected' ? 'رد شده' : 'در انتظار'}</span></td>
                <td>${req.date}</td>
                <td>
                    ${req.status === 'pending' ? `
                        <button class="btn btn-success btn-sm" onclick="approveRequest(${index})"><i class="fas fa-check"></i></button>
                        <button class="btn btn-danger btn-sm" onclick="rejectRequest(${index})"><i class="fas fa-times"></i></button>
                    ` : ''}
                    <button class="btn btn-danger btn-sm" onclick="deleteRequest(${index})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `;
    });
    html += `</tbody></table></div>`;
    container.innerHTML = html;
}

function approveRequest(index) {
    const requests = JSON.parse(localStorage.getItem('sophia_requests')) || [];
    requests[index].status = 'approved';
    localStorage.setItem('sophia_requests', JSON.stringify(requests));
    renderRequests(requests);
    showToast('✅ درخواست تایید شد', 'success');
}

function rejectRequest(index) {
    const requests = JSON.parse(localStorage.getItem('sophia_requests')) || [];
    requests[index].status = 'rejected';
    localStorage.setItem('sophia_requests', JSON.stringify(requests));
    renderRequests(requests);
    showToast('❌ درخواست رد شد', 'info');
}

function deleteRequest(index) {
    if (!confirm('آیا از حذف این درخواست مطمئن هستید؟')) return;
    const requests = JSON.parse(localStorage.getItem('sophia_requests')) || [];
    requests.splice(index, 1);
    localStorage.setItem('sophia_requests', JSON.stringify(requests));
    renderRequests(requests);
    showToast('🗑️ درخواست حذف شد', 'info');
}

// ===== مدیریت سبد خرید =====
function loadCart() {
    const cart = JSON.parse(localStorage.getItem('sophia_cart')) || getMockData().cart;
    renderCart(cart);
}

function renderCart(cart) {
    const container = document.getElementById('cartList');
    if (!cart || cart.length === 0) {
        container.innerHTML = `<div class="empty"><i class="fas fa-shopping-cart"></i>سبد خرید خالی است</div>`;
        return;
    }
    
    let html = `<div class="table-responsive"><table>
        <thead><tr><th>کاربر</th><th>تعداد آیتم</th><th>مبلغ کل</th><th>تاریخ</th><th>عملیات</th></tr></thead><tbody>`;
    cart.forEach((item, index) => {
        html += `
            <tr>
                <td>${item.user}</td>
                <td>${item.items}</td>
                <td>${item.total}</td>
                <td>${item.date}</td>
                <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteCartItem(${index})"><i class="fas fa-trash"></i></button>
                </td>
            </tr>
        `;
    });
    html += `</tbody></table></div>`;
    container.innerHTML = html;
}

function deleteCartItem(index) {
    if (!confirm('آیا از حذف این آیتم مطمئن هستید؟')) return;
    const cart = JSON.parse(localStorage.getItem('sophia_cart')) || [];
    cart.splice(index, 1);
    localStorage.setItem('sophia_cart', JSON.stringify(cart));
    renderCart(cart);
    showToast('🗑️ آیتم حذف شد', 'info');
}

    }
    if (settings.color_secondary) {
        document.getElementById('color_secondary_hex').textContent = settings.color_secondary;
    }
}

function applyColorSettings(settings) {
    if (settings.color_primary) {
        document.documentElement.style.setProperty('--primary', settings.color_primary);
    }
    if (settings.color_secondary) {
        document.documentElement.style.setProperty('--secondary', settings.color_secondary);
    }
}

// ===== تغییر رمز =====
function showChangePassword() {
    document.getElementById('changePasswordModal').classList.add('active');
    document.getElementById('oldPassword').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmNewPassword').value = '';
    document.getElementById('passwordChangeMessage').style.display = 'none';
}

function closeChangePasswordModal() {
    document.getElementById('changePasswordModal').classList.remove('active');
}

document.addEventListener('DOMContentLoaded', function() {
    // بستن مودال با کلیک روی پس‌زمینه
    document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
            }
        });
    });
});

function changePassword() {
    const oldPass = document.getElementById('oldPassword').value.trim();
    const newPass = document.getElementById('newPassword').value.trim();
    const confirmPass = document.getElementById('confirmNewPassword').value.trim();
    const messageDiv = document.getElementById('passwordChangeMessage');
    
    if (oldPass !== ADMIN_PASSWORD) {
        messageDiv.textContent = '❌ رمز فعلی اشتباه است!';
        messageDiv.style.color = 'var(--danger)';
        messageDiv.style.display = 'block';
        return;
    }
    
    if (newPass.length < 4) {
        messageDiv.textContent = '❌ رمز جدید باید حداقل ۴ کاراکتر باشد!';
        messageDiv.style.color = 'var(--danger)';
        messageDiv.style.display = 'block';
        return;
    }
    
    if (newPass !== confirmPass) {
        messageDiv.textContent = '❌ رمز جدید و تکرار آن مطابقت ندارند!';
        messageDiv.style.color = 'var(--danger)';
        messageDiv.style.display = 'block';
        return;
    }
    
    // در اینجا رمز جدید را ذخیره کنید (تغییر ADMIN_PASSWORD)
    // توجه: در دنیای واقعی باید به سرور ارسال شود
    messageDiv.textContent = '✅ رمز با موفقیت تغییر کرد! (توجه: در نسخه فعلی، رمز در مرورگر ذخیره نمی‌شود)';
    messageDiv.style.color = 'var(--success)';
    messageDiv.style.display = 'block';
    setTimeout(() => {
        closeChangePasswordModal();
    }, 2000);
}
