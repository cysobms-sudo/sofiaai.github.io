<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>تست تنظیمات</title>
</head>
<body>
    <h1>تست ذخیره تنظیمات</h1>
    <button onclick="testSave()">ذخیره تست</button>
    <pre id="result"></pre>

    <script>
        function testSave() {
            const data = {
                hero_title: 'عنوان تست از فرم ساده',
                about_text: 'متن تست از فرم ساده',
                footer_text: 'فوتر تست از فرم ساده'
            };

            fetch('https://sofiaaisite.runflare.run/api/admin/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('result').textContent = '✅ نتیجه: ' + JSON.stringify(data, null, 2);
                // بارگذاری مجدد برای نمایش
                return fetch('https://sofiaaisite.runflare.run/api/admin/settings');
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('result').textContent += '\n\n📥 داده‌های جدید:\n' + JSON.stringify(data, null, 2);
            })
            .catch(err => {
                document.getElementById('result').textContent = '❌ خطا: ' + err.message;
            });
        }
    </script>
</body>
</html>
