<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پنل مدیریت | توسعه‌دهنده هوش مصنوعی سوفیا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(145deg, #f0f2f5, #e8ecf1);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .login-box, .admin-box {
            background: #fff;
            padding: 40px;
            border-radius: 24px;
            border: 2px solid #6C3CE1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .login-box { max-width: 500px; text-align: center; }
        .admin-box { display: none; }
        h2 {
            color: #1A0F2E;
            margin-bottom: 16px;
            font-size: 1.8rem;
        }
        h2 .highlight { color: #6C3CE1; }
        .sub {
            color: #7a7a9a;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            font-size: 1rem;
            margin-top: 8px;
            font-family: 'Vazirmatn', sans-serif;
            transition: 0.3s;
        }
        input:focus {
            border-color: #6C3CE1;
            outline: none;
            box-shadow: 0 0 0 3px rgba(108, 60, 225, 0.08);
        }
        .btn-login {
            width: 100%;
            margin-top: 20px;
            background: linear-gradient(145deg, #6C3CE1, #4A1F9E);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
        }
        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(108, 60, 225, 0.3);
        }
        .error {
            color: #e74c3c;
            margin-top: 12px;
            font-size: 0.9rem;
            display: none;
        }

        /* ===== تب‌ها ===== */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            border-bottom: 2px solid #e8ecf1;
            padding-bottom: 12px;
        }
        .tab-btn {
            background: transparent;
            color: #5A4A7A;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            width: auto;
            margin: 0;
        }
        .tab-btn:hover {
            background: rgba(108, 60, 225, 0.06);
            color: #6C3CE1;
        }
        .tab-btn.active {
            background: #6C3CE1;
            color: #fff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeUp 0.4s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== جدول‌ها ===== */
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        th {
            background: #6C3CE1;
            color: #fff;
            padding: 14px 16px;
            text-align: right;
            font-weight: 700;
            white-space: nowrap;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #1A0F2E;
            word-break: break-word;
        }
        tr:hover { background: #f8f6ff; }
        .loading { color: #7a7a9a; padding: 20px; text-align: center; }
        .empty { 
            color: #7a7a9a; 
            padding: 40px; 
            text-align: center; 
        }
        .empty i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
            color: #e0e0e0;
        }

        /* ===== دکمه‌ها ===== */
        .btn {
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.8rem;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-sm { padding: 4px 12px; font-size: 0.75rem; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; transform: scale(1.05); }
        .btn-success { background: #28a745; color: #fff; }
        .btn-success:hover { background: #218838; transform: scale(1.05); }
        .btn-warning { background: #f39c12; color: #fff; }
        .btn-warning:hover { background: #e08e0b; transform: scale(1.05); }

        .badge {
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
        }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-approved { background: #d4edda; color: #155724; }
        .badge-rejected { background: #f8d7da; color: #721c24; }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #6C3CE1;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
        .footer {
            margin-top: 24px;
            color: #9a9aba;
            font-size: 0.8rem;
            border-top: 1px solid #f0f0f0;
            padding-top: 16px;
            text-align: center;
        }
        .stats-summary {
            display: flex;
            gap: 24px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: var(--bg-light, #f8f6ff);
            border-radius: 12px;
        }
        .stats-summary .stat-item {
            font-weight: 600;
            color: #5A4A7A;
        }
        .stats-summary .stat-item span {
            color: #6C3CE1;
            font-size: 1.2rem;
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            direction: rtl;
        }
        .toast {
            padding: 14px 24px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-family: 'Vazirmatn', sans-serif;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            animation: slideDown 0.5s ease;
            min-width: 200px;
            text-align: center;
        }
        .toast.success { background: #28a745; }
        .toast.error { background: #e74c3c; }
        .toast.info { background: #3498db; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-80px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 1; transform: translateX(-50%) translateY(0); }
            to { opacity: 0; transform: translateX(-50%) translateY(-80px); }
        }

        @media (max-width: 768px) {
            .login-box, .admin-box { padding: 20px 16px; }
            th, td { padding: 8px 10px; font-size: 0.8rem; }
            table { font-size: 0.8rem; }
            .tabs { gap: 4px; }
            .tab-btn { padding: 6px 14px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- ===== صفحه ورود ===== -->
    <div id="loginBox" class="login-box">
        <h2>🔐 <span class="highlight">پنل مدیریت</span></h2>
        <p class="sub">برای ورود، رمز عبور را وارد کنید</p>
        <input type="password" id="passwordInput" placeholder="رمز عبور را وارد کنید..." />
        <button class="btn-login" onclick="checkPassword()">ورود</button>
        <div id="errorMsg" class="error">❌ رمز عبور اشتباه است!</div>
    </div>

    <!-- ===== پنل مدیریت ===== -->
    <div id="adminBox" class="admin-box">
        <h2>📋 <span class="highlight">پنل مدیریت</span></h2>
        <p class="sub">مدیریت کاربران، درخواست‌ها و سبد خرید</p>

        <!-- ===== تب‌ها ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="users">👥 کاربران</button>
            <button class="tab-btn" data-tab="requests">📝 درخواست‌ها</button>
            <button class="tab-btn" data-tab="cart">🛒 سبد خرید</button>
        </div>

        <!-- ===== تب کاربران ===== -->
        <div id="tab-users" class="tab-content active">
            <div id="usersList"><div class="loading">⏳ در حال بارگذاری...</div></div>
        </div>

        <!-- ===== تب درخواست‌ها ===== -->
        <div id="tab-requests" class="tab-content">
            <div id="requestsList"><div class="loading">⏳ در حال بارگذاری...</div></div>
        </div>

        <!-- ===== تب سبد خرید ===== -->
        <div id="tab-cart" class="tab-content">
            <div id="cartList"><div class="loading">⏳ در حال بارگذاری...</div></div>
        </div>

        <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
        <div class="footer">🔒 فقط با رمز عبور قابل دسترسی است</div>
    </div>

    <script>
        // ===== تنظیمات =====
        const API_BASE = 'https://sofiaaisite.runflare.run';
        const ADMIN_PASSWORD = '123456';

        // =============================================
        // ===== ورود =====
        // =============================================
        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (input === ADMIN_PASSWORD) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminBox').style.display = 'block';
                loadAllTabs();
            } else {
                errorMsg.style.display = 'block';
                setTimeout(() => { errorMsg.style.display = 'none'; }, 3000);
            }
        }

        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });

        // =============================================
        // ===== Toast =====
        // =============================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer') || createToastContainer();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function createToastContainer() {
            const container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'toast-container';
            document.body.appendChild(container);
            return container;
        }

        // =============================================
        // ===== مدیریت تب‌ها =====
        // =============================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                document.getElementById('tab-' + this.dataset.tab).classList.add('active');
                
                if (this.dataset.tab === 'users') loadUsers();
                else if (this.dataset.tab === 'requests') loadRequests();
                else if (this.dataset.tab === 'cart') loadCartItems();
            });
        });

        function loadAllTabs() {
            loadUsers();
            loadRequests();
            loadCartItems();
        }

        // =============================================
        // ===== ۱. بارگذاری کاربران =====
        // =============================================
        function loadUsers() {
            const container = document.getElementById('usersList');
            container.innerHTML = '<div class="loading">⏳ در حال دریافت اطلاعات...</div>';

            fetch(`${API_BASE}/api/users`)
                .then(response => {
                    if (!response.ok) throw new Error('خطا در دریافت اطلاعات');
                    return response.json();
                })
                .then(data => {
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty"><i class="fas fa-users"></i>هنوز کاربری ثبت‌نام نکرده است.</div>';
                        return;
                    }

                    let html = `
                        <div class="stats-summary">
                            <span class="stat-item">👥 تعداد کل کاربران: <span>${data.length}</span></span>
                        </div>
                        <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>نام و نام خانوادگی</th>
                                    <th>ایمیل</th>
                                    <th>شماره تماس</th>
                                    <th>تاریخ ثبت‌نام</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.forEach((user, index) => {
                        html += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${user.name}</td>
                                <td>${user.email}</td>
                                <td>${user.phone || '-'}</td>
                                <td>${user.created_at}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm" data-id="${user.id}" data-name="${user.name}">
                                        <i class="fas fa-trash-alt"></i> حذف
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `</tbody></table></div>`;
                    container.innerHTML = html;

                    document.querySelectorAll('#usersList .btn-danger').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const userId = this.dataset.id;
                            const userName = this.dataset.name;
                            if (confirm(`⚠️ آیا از حذف کاربر "${userName}" اطمینان دارید؟`)) {
                                deleteUser(userId);
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    container.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle"></i>خطا در دریافت اطلاعات: ${error.message}</div>`;
                });
        }

        function deleteUser(userId) {
            fetch(`${API_BASE}/api/users/${userId}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        showToast('✅ ' + data.message, 'success');
                        loadUsers();
                    } else {
                        showToast('❌ ' + data.error, 'error');
                    }
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    showToast('❌ خطا در حذف کاربر.', 'error');
                });
        }

        // =============================================
        // ===== ۲. بارگذاری درخواست‌ها =====
        // =============================================
        function loadRequests() {
            const container = document.getElementById('requestsList');
            container.innerHTML = '<div class="loading">⏳ در حال دریافت درخواست‌ها...</div>';

            fetch(`${API_BASE}/api/chatbot-requests`)
                .then(response => {
                    if (!response.ok) throw new Error('خطا در دریافت اطلاعات');
                    return response.json();
                })
                .then(data => {
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty"><i class="fas fa-clipboard-list"></i>هیچ درخواستی ثبت نشده است.</div>';
                        return;
                    }

                    let html = `
                        <div class="stats-summary">
                            <span class="stat-item">📝 تعداد کل درخواست‌ها: <span>${data.length}</span></span>
                        </div>
                        <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>نام</th>
                                    <th>شماره تماس</th>
                                    <th>ایمیل</th>
                                    <th>توضیحات</th>
                                    <th>تاریخ</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.forEach((req, index) => {
                        html += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${req.name}</td>
                                <td>${req.phone}</td>
                                <td>${req.email}</td>
                                <td style="max-width:200px; word-break:break-word;">${req.description}</td>
                                <td>${req.created_at}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm" data-id="${req.id}" data-name="${req.name}">
                                        <i class="fas fa-trash-alt"></i> حذف
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `</tbody></table></div>`;
                    container.innerHTML = html;

                    document.querySelectorAll('#requestsList .btn-danger').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const reqId = this.dataset.id;
                            const reqName = this.dataset.name;
                            if (confirm(`⚠️ آیا از حذف درخواست "${reqName}" اطمینان دارید؟`)) {
                                deleteRequest(reqId);
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    container.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle"></i>خطا در دریافت درخواست‌ها.</div>`;
                });
        }

        function deleteRequest(requestId) {
            fetch(`${API_BASE}/api/chatbot-requests/${requestId}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        showToast('✅ ' + data.message, 'success');
                        loadRequests();
                    } else {
                        showToast('❌ ' + data.error, 'error');
                    }
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    showToast('❌ خطا در حذف درخواست.', 'error');
                });
        }

        // =============================================
        // ===== ۳. بارگذاری سبد خرید =====
        // =============================================
        function loadCartItems() {
            const container = document.getElementById('cartList');
            container.innerHTML = '<div class="loading">⏳ در حال دریافت اطلاعات سبد خرید...</div>';

            fetch(`${API_BASE}/api/admin/cart`)
                .then(response => {
                    if (!response.ok) throw new Error('خطا در دریافت اطلاعات');
                    return response.json();
                })
                .then(data => {
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty"><i class="fas fa-shopping-cart"></i>هیچ آیتمی در سبد خرید کاربران وجود ندارد.</div>';
                        return;
                    }

                    // محاسبه مجموع
                    let totalItems = data.length;
                    let totalPrice = 0;
                    data.forEach(item => {
                        const price = parseFloat(item.item_price?.replace(/[^0-9.]/g, '') || 0);
                        if (!isNaN(price)) totalPrice += price;
                    });

                    let html = `
                        <div class="stats-summary">
                            <span class="stat-item">🛒 تعداد کل آیتم‌ها: <span>${totalItems}</span></span>
                            <span class="stat-item">💰 مجموع مبلغ: <span>${totalPrice.toLocaleString()} تومان</span></span>
                        </div>
                        <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>نام کاربر</th>
                                    <th>ایمیل</th>
                                    <th>شماره تماس</th>
                                    <th>نام خدمت</th>
                                    <th>قیمت</th>
                                    <th>تاریخ افزودن</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.forEach((item, index) => {
                        html += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${item.user_name}</td>
                                <td>${item.user_email}</td>
                                <td>${item.user_phone || '-'}</td>
                                <td>${item.item_name}</td>
                                <td>${item.item_price || '-'}</td>
                                <td>${item.created_at}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm" data-id="${item.id}" data-name="${item.item_name}">
                                        <i class="fas fa-trash-alt"></i> حذف
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `</tbody></table></div>`;
                    container.innerHTML = html;

                    document.querySelectorAll('#cartList .btn-danger').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const cartId = this.dataset.id;
                            const itemName = this.dataset.name;
                            if (confirm(`⚠️ آیا از حذف آیتم "${itemName}" از سبد خرید اطمینان دارید؟`)) {
                                deleteCartItem(cartId);
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    container.innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle"></i>خطا در دریافت اطلاعات سبد خرید.</div>`;
                });
        }

        function deleteCartItem(cartId) {
            fetch(`${API_BASE}/api/cart/${cartId}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        showToast('✅ ' + data.message, 'success');
                        loadCartItems();
                    } else {
                        showToast('❌ ' + data.error, 'error');
                    }
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    showToast('❌ خطا در حذف آیتم از سبد خرید.', 'error');
                });
        }
    </script>
</body>
</html>
