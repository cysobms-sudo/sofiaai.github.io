<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پنل مدیریت | توسعه‌دهنده هوش مصنوعی سوفیا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        /* ===== استایل‌های کامل ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(145deg, #f0f2f5, #e8ecf1);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .login-box, .admin-box {
            background: #fff;
            padding: 40px;
            border-radius: 24px;
            border: 2px solid #6C3CE1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }
        .login-box { max-width: 500px; text-align: center; }
        .admin-box { display: none; }
        h2 {
            color: #1A0F2E;
            margin-bottom: 16px;
            font-size: 1.8rem;
        }
        h2 .highlight { color: #6C3CE1; }
        .sub {
            color: #7a7a9a;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            font-size: 1rem;
            margin-top: 8px;
            font-family: 'Vazirmatn', sans-serif;
            transition: 0.3s;
        }
        input:focus {
            border-color: #6C3CE1;
            outline: none;
            box-shadow: 0 0 0 3px rgba(108, 60, 225, 0.08);
        }
        button {
            width: 100%;
            margin-top: 20px;
            background: linear-gradient(145deg, #6C3CE1, #4A1F9E);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(108, 60, 225, 0.3);
        }
        .error {
            color: #e74c3c;
            margin-top: 12px;
            font-size: 0.9rem;
            display: none;
        }

        /* ===== تب‌های مدیریت ===== */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            border-bottom: 2px solid #e8ecf1;
            padding-bottom: 12px;
        }
        .tab-btn {
            background: transparent;
            color: #5A4A7A;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            width: auto;
            margin: 0;
        }
        .tab-btn:hover {
            background: rgba(108, 60, 225, 0.06);
            color: #6C3CE1;
        }
        .tab-btn.active {
            background: #6C3CE1;
            color: #fff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* ===== جدول‌ها ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }
        th {
            background: #6C3CE1;
            color: #fff;
            padding: 14px 16px;
            text-align: right;
            font-weight: 700;
            white-space: nowrap;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #1A0F2E;
            word-break: break-word;
        }
        tr:hover { background: #f8f6ff; }
        .loading { color: #7a7a9a; padding: 20px; text-align: center; }
        .empty { color: #7a7a9a; padding: 20px; text-align: center; }

        /* ===== دکمه‌ها ===== */
        .delete-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .delete-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #6C3CE1;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
        .footer {
            margin-top: 24px;
            color: #9a9aba;
            font-size: 0.8rem;
            border-top: 1px solid #f0f0f0;
            padding-top: 16px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .login-box, .admin-box { padding: 20px 16px; }
            th, td { padding: 8px 10px; font-size: 0.8rem; }
            table { font-size: 0.8rem; }
            .tabs { gap: 4px; }
            .tab-btn { padding: 6px 14px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- ===== صفحه ورود ===== -->
    <div id="loginBox" class="login-box">
        <h2>🔐 <span class="highlight">پنل مدیریت</span></h2>
        <p class="sub">برای ورود، رمز عبور را وارد کنید</p>
        <input type="password" id="passwordInput" placeholder="رمز عبور را وارد کنید..." />
        <button onclick="checkPassword()">ورود</button>
        <div id="errorMsg" class="error">❌ رمز عبور اشتباه است!</div>
    </div>

    <!-- ===== پنل مدیریت ===== -->
    <div id="adminBox" class="admin-box">
        <h2>📋 <span class="highlight">پنل مدیریت</span></h2>
        <p class="sub">مدیریت کاربران، درخواست‌ها و سبد خرید</p>

        <!-- ===== تب‌ها ===== -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="users">👥 کاربران</button>
            <button class="tab-btn" data-tab="requests">📝 درخواست‌ها</button>
            <button class="tab-btn" data-tab="cart">🛒 سبد خرید</button>
        </div>

        <!-- ===== تب کاربران ===== -->
        <div id="tab-users" class="tab-content active">
            <div id="usersList"><div class="loading">⏳ در حال بارگذاری...</div></div>
        </div>

        <!-- ===== تب درخواست‌ها ===== -->
        <div id="tab-requests" class="tab-content">
            <div id="requestsList"><div class="loading">⏳ در حال بارگذاری...</div></div>
        </div>

        <!-- ===== تب سبد خرید ===== -->
        <div id="tab-cart" class="tab-content">
            <div id="cartList"><div class="loading">⏳ در حال بارگذاری...</div></div>
        </div>

        <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
        <div class="footer">🔒 فقط با رمز عبور قابل دسترسی است</div>
    </div>

    <script>
        // ===== رمز عبور =====
        const correctPassword = 'Ard$447100';

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (input === correctPassword) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminBox').style.display = 'block';
                loadAllTabs();
            } else {
                errorMsg.style.display = 'block';
                setTimeout(() => { errorMsg.style.display = 'none'; }, 3000);
            }
        }

        // ===== مدیریت تب‌ها =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                document.getElementById('tab-' + this.dataset.tab).classList.add('active');
                
                if (this.dataset.tab === 'users') loadUsers();
                else if (this.dataset.tab === 'requests') loadRequests();
                else if (this.dataset.tab === 'cart') loadCartItems();
            });
        });

        function loadAllTabs() {
            loadUsers();
            loadRequests();
            loadCartItems();
        }

        // =============================================
        // ===== ۱. بارگذاری کاربران =====
        // =============================================
        function loadUsers() {
            const container = document.getElementById('usersList');
            container.innerHTML = '<div class="loading">⏳ در حال دریافت اطلاعات...</div>';

            fetch('/api/users')
                .then(response => response.json())
                .then(data => {
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty">❌ هنوز کاربری ثبت‌نام نکرده است.</div>';
                        return;
                    }

                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>نام و نام خانوادگی</th>
                                    <th>ایمیل</th>
                                    <th>شماره تماس</th>
                                    <th>تاریخ ثبت‌نام</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.forEach((user, index) => {
                        html += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${user.name}</td>
                                <td>${user.email}</td>
                                <td>${user.phone || '-'}</td>
                                <td>${user.created_at}</td>
                                <td>
                                    <button class="delete-btn" data-id="${user.id}" data-name="${user.name}">
                                        <i class="fas fa-trash-alt"></i> حذف
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `</tbody></table><div style="text-align:center; margin-top:12px; color:#7a7a9a; font-size:0.85rem;">🔹 تعداد کل کاربران: ${data.length}</div>`;
                    container.innerHTML = html;

                    document.querySelectorAll('#usersList .delete-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const userId = this.dataset.id;
                            const userName = this.dataset.name;
                            if (confirm(`⚠️ آیا از حذف کاربر "${userName}" اطمینان دارید؟`)) {
                                deleteUser(userId);
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    container.innerHTML = '<div class="empty">❌ خطا در دریافت اطلاعات.</div>';
                });
        }

        function deleteUser(userId) {
            fetch(`/api/users/${userId}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        alert('✅ ' + data.message);
                        loadUsers();
                    } else {
                        alert('❌ ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    alert('❌ خطا در حذف کاربر.');
                });
        }

        // =============================================
        // ===== ۲. بارگذاری درخواست‌های چت‌بات =====
        // =============================================
        function loadRequests() {
            const container = document.getElementById('requestsList');
            container.innerHTML = '<div class="loading">⏳ در حال دریافت درخواست‌ها...</div>';

            fetch('/api/chatbot-requests')
                .then(response => response.json())
                .then(data => {
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty">❌ هیچ درخواستی ثبت نشده است.</div>';
                        return;
                    }

                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>نام</th>
                                    <th>شماره تماس</th>
                                    <th>ایمیل</th>
                                    <th>توضیحات</th>
                                    <th>تاریخ</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.forEach((req, index) => {
                        html += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${req.name}</td>
                                <td>${req.phone}</td>
                                <td>${req.email}</td>
                                <td style="max-width:200px; word-break:break-word;">${req.description}</td>
                                <td>${req.created_at}</td>
                                <td>
                                    <button class="delete-btn" data-id="${req.id}" data-name="${req.name}">
                                        <i class="fas fa-trash-alt"></i> حذف
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `</tbody></table><div style="text-align:center; margin-top:12px; color:#7a7a9a; font-size:0.85rem;">🔹 تعداد کل درخواست‌ها: ${data.length}</div>`;
                    container.innerHTML = html;

                    document.querySelectorAll('#requestsList .delete-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const reqId = this.dataset.id;
                            const reqName = this.dataset.name;
                            if (confirm(`⚠️ آیا از حذف درخواست "${reqName}" اطمینان دارید؟`)) {
                                deleteRequest(reqId);
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    container.innerHTML = '<div class="empty">❌ خطا در دریافت درخواست‌ها.</div>';
                });
        }

        function deleteRequest(requestId) {
            fetch(`/api/chatbot-requests/${requestId}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        alert('✅ ' + data.message);
                        loadRequests();
                    } else {
                        alert('❌ ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    alert('❌ خطا در حذف درخواست.');
                });
        }

        // =============================================
        // ===== ۳. بارگذاری سبد خرید همه کاربران =====
        // =============================================
        function loadCartItems() {
            const container = document.getElementById('cartList');
            container.innerHTML = '<div class="loading">⏳ در حال دریافت اطلاعات سبد خرید...</div>';

            fetch('/api/admin/cart')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('خطا در دریافت اطلاعات');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.length === 0) {
                        container.innerHTML = '<div class="empty">❌ هیچ آیتمی در سبد خرید کاربران وجود ندارد.</div>';
                        return;
                    }

                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>نام کاربر</th>
                                    <th>ایمیل</th>
                                    <th>شماره تماس</th>
                                    <th>نام خدمت</th>
                                    <th>قیمت</th>
                                    <th>تاریخ افزودن</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.forEach((item, index) => {
                        html += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${item.user_name}</td>
                                <td>${item.user_email}</td>
                                <td>${item.user_phone || '-'}</td>
                                <td>${item.item_name}</td>
                                <td>${item.item_price}</td>
                                <td>${item.created_at}</td>
                                <td>
                                    <button class="delete-btn" data-id="${item.id}" data-name="${item.item_name}">
                                        <i class="fas fa-trash-alt"></i> حذف
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `</tbody></table><div style="text-align:center; margin-top:12px; color:#7a7a9a; font-size:0.85rem;">🔹 تعداد کل آیتم‌ها: ${data.length}</div>`;
                    container.innerHTML = html;

                    document.querySelectorAll('#cartList .delete-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const cartId = this.dataset.id;
                            const itemName = this.dataset.name;
                            if (confirm(`⚠️ آیا از حذف آیتم "${itemName}" از سبد خرید اطمینان دارید؟`)) {
                                deleteCartItem(cartId);
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    container.innerHTML = '<div class="empty">❌ خطا در دریافت اطلاعات سبد خرید.</div>';
                });
        }

        function deleteCartItem(cartId) {
            fetch(`/api/cart/${cartId}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        alert('✅ ' + data.message);
                        loadCartItems();
                    } else {
                        alert('❌ ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    alert('❌ خطا در حذف آیتم از سبد خرید.');
                });
        }

        // ===== ورود با کلید Enter =====
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
