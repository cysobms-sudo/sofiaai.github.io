<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سبد خرید | سوفیا AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #f5f7fc;
            color: #1A0F2E;
            direction: rtl;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            border-radius: 24px;
            padding: 30px;
            border: 2px solid #FFB800;
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.06);
        }
        h1 {
            text-align: center;
            color: #1A0F2E;
            margin-bottom: 24px;
            font-size: 2rem;
        }
        h1 .highlight {
            background: linear-gradient(145deg, #6C3CE1, #FFB800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .cart-item .name {
            font-weight: 700;
        }
        .cart-item .price {
            color: #6C3CE1;
            font-weight: 700;
        }
        .cart-item .remove-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            transition: 0.3s;
        }
        .cart-item .remove-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
        .cart-total {
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            font-weight: 700;
            border-top: 2px solid #FFB800;
            margin-top: 12px;
            font-size: 1.2rem;
        }
        .cart-total .total-price {
            color: #6C3CE1;
        }
        .empty-cart {
            text-align: center;
            padding: 40px 0;
            color: #7a7a9a;
        }
        .empty-cart i {
            font-size: 4rem;
            display: block;
            margin-bottom: 16px;
            color: #ddd;
        }
        .btn-checkout {
            width: 100%;
            background: linear-gradient(145deg, #6C3CE1, #4A1F9E);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
            margin-top: 16px;
        }
        .btn-checkout:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(108, 60, 225, 0.3);
        }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #6C3CE1;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            padding: 40px 0;
            color: #7a7a9a;
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #9a9aba;
            font-size: 0.8rem;
            border-top: 1px solid #f0f0f0;
            padding-top: 16px;
        }
        .user-info {
            text-align: center;
            color: #5A4A7A;
            margin-bottom: 20px;
        }
        .user-info strong {
            color: #1A0F2E;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 <span class="highlight">سبد خرید</span></h1>
        <div class="user-info" id="userInfo"></div>
        <div id="cartItems">
            <div class="loading">⏳ در حال بارگذاری...</div>
        </div>
        <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
        <div class="footer">✨ سبد خرید شما در سرور ذخیره می‌شود</div>
    </div>

    <script>
        // ===== دریافت اطلاعات کاربر =====
        const userData = localStorage.getItem('user');
        if (!userData) {
            alert('⚠️ لطفاً ابتدا وارد شوید.');
            window.location.href = 'login.html';
        }
        const user = JSON.parse(userData);
        const userId = user.id;

        // ===== نمایش نام کاربر =====
        document.getElementById('userInfo').innerHTML = `
            <strong>${user.name}</strong> عزیز، خوش آمدید!
        `;

        // ===== بارگذاری سبد خرید از سرور =====
        async function loadCart() {
            const container = document.getElementById('cartItems');
            container.innerHTML = '<div class="loading">⏳ در حال بارگذاری سبد خرید...</div>';

            try {
                const response = await fetch(`https://sofiaaisite.runflare.run/api/cart/${userId}`);
                if (!response.ok) {
                    throw new Error('خطا در دریافت سبد خرید');
                }
                const cart = await response.json();

                if (cart.length === 0) {
                    container.innerHTML = `
                        <div class="empty-cart">
                            <i class="fas fa-shopping-basket"></i>
                            <p>سبد خرید شما خالی است.</p>
                            <p style="font-size:0.9rem;">برای افزودن خدمات، به <a href="index.html" style="color:#6C3CE1;font-weight:700;">صفحه اصلی</a> بروید.</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                cart.forEach(item => {
                    html += `
                        <div class="cart-item" data-id="${item.id}">
                            <span class="name">${item.item_name}</span>
                            <span class="price">${item.item_price}</span>
                            <button class="remove-btn" onclick="removeItem(${item.id})"><i class="fas fa-trash-alt"></i> حذف</button>
                        </div>
                    `;
                });

                html += `
                    <div class="cart-total">
                        <span>جمع کل:</span>
                        <span class="total-price">${cart.length} خدمت</span>
                    </div>
                    <button class="btn-checkout" onclick="checkout()">✅ ثبت درخواست نهایی</button>
                `;

                container.innerHTML = html;

            } catch (error) {
                console.error('❌ خطا:', error);
                container.innerHTML = '<div class="empty-cart">❌ خطا در دریافت سبد خرید. لطفاً دوباره تلاش کنید.</div>';
            }
        }

        // ===== حذف آیتم از سبد خرید =====
        async function removeItem(cartId) {
            if (!confirm('آیا از حذف این آیتم اطمینان دارید؟')) return;

            try {
                const response = await fetch(`https://sofiaaisite.runflare.run/api/cart/${cartId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();

                if (response.ok) {
                    alert('✅ آیتم با موفقیت حذف شد.');
                    loadCart();
                    updateCartBadge();
                } else {
                    alert('❌ ' + data.error);
                }
            } catch (error) {
                console.error('❌ خطا:', error);
                alert('❌ خطا در حذف آیتم.');
            }
        }

        // ===== ثبت درخواست نهایی =====
        async function checkout() {
            if (!confirm('آیا از ثبت نهایی درخواست خود اطمینان دارید؟')) return;

            try {
                const response = await fetch(`https://sofiaaisite.runflare.run/api/cart/checkout/${userId}`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (response.ok) {
                    alert('✅ ' + data.message);
                    loadCart();
                    updateCartBadge();
                } else {
                    alert('❌ ' + data.error);
                }
            } catch (error) {
                console.error('❌ خطا:', error);
                alert('❌ خطا در ثبت درخواست.');
            }
        }

        // ===== به‌روزرسانی تعداد سبد خرید در هدر =====
        function updateCartBadge() {
            const badge = document.getElementById('cartCount');
            if (badge) {
                // دریافت تعداد از سرور
                fetch(`https://sofiaaisite.runflare.run/api/cart/${userId}`)
                    .then(res => res.json())
                    .then(cart => {
                        badge.textContent = cart.length;
                    })
                    .catch(() => {
                        // اگر خطا بود، مقدار قبلی را نگه دار
                    });
            }
        }

        // ===== بارگذاری اولیه =====
        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
