<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سبد خرید | سوفیا AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(145deg, #f0f2f5, #e8ecf1);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            border-radius: 24px;
            padding: 32px;
            border: 2px solid #6C3CE1;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h1 {
            font-size: 2rem;
            color: #1A0F2E;
            margin-bottom: 8px;
        }
        h1 .highlight { color: #6C3CE1; }
        .sub {
            color: #7a7a9a;
            margin-bottom: 24px;
        }

        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        th {
            background: #f8f6ff;
            padding: 12px 16px;
            text-align: right;
            font-weight: 700;
            color: #1A0F2E;
            border-bottom: 2px solid #6C3CE1;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #1A0F2E;
        }
        tr:hover { background: #f8f6ff; }

        .btn {
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.8rem;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; transform: scale(1.05); }
        .btn-primary { background: #6C3CE1; color: #fff; }
        .btn-primary:hover { background: #4A1F9E; transform: scale(1.05); }
        .btn-success { background: #28a745; color: #fff; }
        .btn-success:hover { background: #218838; transform: scale(1.05); }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #7a7a9a;
        }
        .empty i {
            font-size: 3rem;
            display: block;
            margin-bottom: 16px;
            color: #e0e0e0;
        }
        .empty .btn {
            margin-top: 16px;
            padding: 10px 32px;
            font-size: 1rem;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #7a7a9a;
        }

        .cart-summary {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .cart-summary .total {
            font-size: 1.2rem;
            font-weight: 700;
        }
        .cart-summary .total span {
            color: #6C3CE1;
            font-size: 1.4rem;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #6C3CE1;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }

        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            direction: rtl;
        }
        .toast {
            padding: 14px 24px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-family: 'Vazirmatn', sans-serif;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            animation: slideDown 0.5s ease;
            min-width: 200px;
            text-align: center;
        }
        .toast.success { background: #28a745; }
        .toast.error { background: #e74c3c; }
        .toast.info { background: #3498db; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-80px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 1; transform: translateX(-50%) translateY(0); }
            to { opacity: 0; transform: translateX(-50%) translateY(-80px); }
        }

        @media (max-width: 768px) {
            .container { padding: 16px; }
            h1 { font-size: 1.5rem; }
            th, td { padding: 8px 10px; font-size: 0.8rem; }
            .cart-summary { flex-direction: column; align-items: stretch; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 <span class="highlight">سبد خرید</span></h1>
        <p class="sub">خدمات انتخاب شده توسط شما</p>

        <div id="cartContainer">
            <div class="loading">⏳ در حال بارگذاری سبد خرید...</div>
        </div>

        <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
    </div>

    <script>
        // ===== تنظیمات =====
        const API_BASE = 'https://sofiaaisite.sofiaai.ir';

        // =============================================
        // ===== بررسی وضعیت کاربر =====
        // =============================================
        function checkUser() {
            const userData = localStorage.getItem('user');
            if (!userData) {
                window.location.href = 'login.html';
                return null;
            }
            try {
                return JSON.parse(userData);
            } catch(e) {
                localStorage.removeItem('user');
                window.location.href = 'login.html';
                return null;
            }
        }

        // =============================================
        // ===== Toast =====
        // =============================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer') || createToastContainer();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function createToastContainer() {
            const container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'toast-container';
            document.body.appendChild(container);
            return container;
        }

        // =============================================
        // ===== بارگذاری سبد خرید =====
        // =============================================
        function loadCart(userId) {
            const container = document.getElementById('cartContainer');
            container.innerHTML = '<div class="loading">⏳ در حال بارگذاری سبد خرید...</div>';

            fetch(`${API_BASE}/api/cart/${userId}`)
                .then(response => {
                    if (!response.ok) throw new Error('خطا در دریافت اطلاعات');
                    return response.json();
                })
                .then(data => {
                    if (data.length === 0) {
                        container.innerHTML = `
                            <div class="empty">
                                <i class="fas fa-shopping-cart"></i>
                                <h3>سبد خرید شما خالی است</h3>
                                <p>برای افزودن خدمت به سبد خرید، از صفحه اصلی اقدام کنید.</p>
                                <a href="index.html#assistant" class="btn btn-primary">
                                    <i class="fas fa-plus"></i> مشاهده خدمات
                                </a>
                            </div>
                        `;
                        return;
                    }

                    let total = 0;
                    let html = `
                        <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>نام خدمت</th>
                                    <th>قیمت</th>
                                    <th>تاریخ افزودن</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.forEach((item, index) => {
                        const price = parseFloat(item.item_price?.replace(/[^0-9.]/g, '') || 0);
                        if (!isNaN(price)) total += price;
                        
                        const date = item.created_at ? new Date(item.created_at).toLocaleDateString('fa-IR') : '-';
                        
                        html += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${item.item_name}</td>
                                <td>${item.item_price || '-'}</td>
                                <td>${date}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm" onclick="removeFromCart(${item.id})">
                                        <i class="fas fa-trash-alt"></i> حذف
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `
                            </tbody>
                        </table></div>
                        <div class="cart-summary">
                            <div class="total">💰 مجموع: <span>${total.toLocaleString()}</span> تومان</div>
                            <div style="display:flex; gap:12px; flex-wrap:wrap;">
                                <button class="btn btn-success" onclick="checkout()">
                                    <i class="fas fa-check"></i> ثبت سفارش
                                </button>
                                <a href="index.html#assistant" class="btn btn-primary" style="text-decoration:none;">
                                    <i class="fas fa-plus"></i> افزودن خدمت
                                </a>
                            </div>
                        </div>
                    `;

                    container.innerHTML = html;
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    container.innerHTML = `
                        <div class="empty">
                            <i class="fas fa-exclamation-circle"></i>
                            <h3>خطا در دریافت سبد خرید</h3>
                            <p>${error.message}</p>
                            <button onclick="location.reload()" class="btn btn-primary">
                                <i class="fas fa-redo"></i> تلاش مجدد
                            </button>
                        </div>
                    `;
                });
        }

        // =============================================
        // ===== حذف از سبد خرید =====
        // =============================================
        function removeFromCart(cartId) {
            if (!confirm('آیا از حذف این آیتم از سبد خرید مطمئن هستید؟')) return;

            fetch(`${API_BASE}/api/cart/${cartId}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        showToast('✅ ' + data.message, 'success');
                        const user = checkUser();
                        if (user) loadCart(user.id);
                    } else {
                        showToast('❌ ' + data.error, 'error');
                    }
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    showToast('❌ خطا در حذف آیتم.', 'error');
                });
        }

        // =============================================
        // ===== ثبت سفارش =====
        // =============================================
        function checkout() {
            showToast('🛒 در حال پردازش سفارش شما...', 'info');
            // در اینجا می‌توانید منطق ثبت سفارش را پیاده‌سازی کنید
            setTimeout(() => {
                showToast('✅ سفارش شما با موفقیت ثبت شد!', 'success');
            }, 2000);
        }

        // =============================================
        // ===== مقداردهی اولیه =====
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            const user = checkUser();
            if (!user) return;
            loadCart(user.id);
        });
    </script>
</body>
</html>
