<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>داشبورد کاربری | سوفیا AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(145deg, #f0f2f5, #e8ecf1);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== هدر ===== */
        .dashboard-header {
            background: #fff;
            border-radius: 24px;
            padding: 24px 32px;
            border: 2px solid #6C3CE1;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }
        .dashboard-header h1 {
            font-size: 1.6rem;
            color: #1A0F2E;
        }
        .dashboard-header h1 .highlight { color: #6C3CE1; }
        .dashboard-header .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .dashboard-header .user-info .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #6C3CE1;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .dashboard-header .user-info .name {
            font-weight: 700;
            color: #1A0F2E;
        }
        .dashboard-header .user-info .email {
            font-size: 0.85rem;
            color: #7a7a9a;
        }
        .btn-logout {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            transition: 0.3s;
        }
        .btn-logout:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.3);
        }

        /* ===== کارت‌ها ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #fff;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(108, 60, 225, 0.08);
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            transition: 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 900;
            color: #6C3CE1;
        }
        .stat-card .label {
            color: #7a7a9a;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .stat-card .icon {
            font-size: 2rem;
            color: #FFB800;
            margin-bottom: 8px;
        }

        /* ===== بخش سبد خرید ===== */
        .cart-section {
            background: #fff;
            border-radius: 24px;
            padding: 24px 32px;
            border: 1px solid rgba(108, 60, 225, 0.08);
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .cart-section h2 {
            margin-bottom: 16px;
            color: #1A0F2E;
            font-size: 1.4rem;
        }
        .cart-section h2 i { color: #6C3CE1; }

        /* ===== جدول ===== */
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        th {
            background: #f8f6ff;
            padding: 12px 16px;
            text-align: right;
            font-weight: 700;
            color: #1A0F2E;
            border-bottom: 2px solid #6C3CE1;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f0f0;
            color: #1A0F2E;
        }
        tr:hover { background: #f8f6ff; }

        /* ===== دکمه‌ها ===== */
        .btn {
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 0.8rem;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; transform: scale(1.05); }
        .btn-primary { background: #6C3CE1; color: #fff; }
        .btn-primary:hover { background: #4A1F9E; transform: scale(1.05); }

        .empty {
            text-align: center;
            padding: 40px;
            color: #7a7a9a;
        }
        .empty i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 12px;
            color: #e0e0e0;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #7a7a9a;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #6C3CE1;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            direction: rtl;
        }
        .toast {
            padding: 14px 24px;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            font-family: 'Vazirmatn', sans-serif;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            animation: slideDown 0.5s ease;
            min-width: 200px;
            text-align: center;
        }
        .toast.success { background: #28a745; }
        .toast.error { background: #e74c3c; }
        .toast.info { background: #3498db; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-80px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        @keyframes slideUp {
            from { opacity: 1; transform: translateX(-50%) translateY(0); }
            to { opacity: 0; transform: translateX(-50%) translateY(-80px); }
        }

        @media (max-width: 768px) {
            .dashboard-header { padding: 16px; flex-direction: column; align-items: stretch; text-align: center; }
            .dashboard-header .user-info { justify-content: center; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .cart-section { padding: 16px; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- ===== هدر ===== -->
        <div class="dashboard-header" id="dashboardHeader">
            <h1>📊 <span class="highlight">داشبورد</span> کاربری</h1>
            <div class="user-info">
                <div class="avatar" id="userAvatar">ع</div>
                <div>
                    <div class="name" id="userName">کاربر</div>
                    <div class="email" id="userEmail">ایمیل</div>
                </div>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>
        </div>

        <!-- ===== آمار ===== -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="icon">🛒</div>
                <div class="number" id="cartCount">0</div>
                <div class="label">آیتم‌های سبد خرید</div>
            </div>
            <div class="stat-card">
                <div class="icon">📝</div>
                <div class="number" id="orderCount">0</div>
                <div class="label">سفارش‌های ثبت شده</div>
            </div>
            <div class="stat-card">
                <div class="icon">📅</div>
                <div class="number" id="memberDays">0</div>
                <div class="label">روزهای عضویت</div>
            </div>
        </div>

        <!-- ===== سبد خرید ===== -->
        <div class="cart-section">
            <h2><i class="fas fa-shopping-cart"></i> سبد خرید شما</h2>
            <div id="cartContainer">
                <div class="loading">⏳ در حال بارگذاری...</div>
            </div>
        </div>

        <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
    </div>

    <script>
        // ===== تنظیمات =====
        const API_BASE = 'https://sofiaaisite.runflare.run';

        // =============================================
        // ===== بررسی وضعیت کاربر =====
        // =============================================
        function checkUser() {
            const userData = localStorage.getItem('user');
            if (!userData) {
                window.location.href = 'login.html';
                return null;
            }
            try {
                return JSON.parse(userData);
            } catch(e) {
                localStorage.removeItem('user');
                window.location.href = 'login.html';
                return null;
            }
        }

        // =============================================
        // ===== نمایش اطلاعات کاربر =====
        // =============================================
        function displayUserInfo(user) {
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userAvatar').textContent = user.name.charAt(0);
            
            // محاسبه روزهای عضویت
            if (user.created_at) {
                const joinDate = new Date(user.created_at);
                const now = new Date();
                const days = Math.floor((now - joinDate) / (1000 * 60 * 60 * 24));
                document.getElementById('memberDays').textContent = days || 1;
            }
        }

        // =============================================
        // ===== Toast =====
        // =============================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer') || createToastContainer();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function createToastContainer() {
            const container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'toast-container';
            document.body.appendChild(container);
            return container;
        }

        // =============================================
        // ===== خروج =====
        // =============================================
        function logout() {
            if (confirm('آیا از خروج از حساب کاربری مطمئن هستید؟')) {
                localStorage.removeItem('user');
                window.location.href = 'index.html';
            }
        }

        // =============================================
        // ===== بارگذاری سبد خرید =====
        // =============================================
        function loadCart(userId) {
            const container = document.getElementById('cartContainer');
            container.innerHTML = '<div class="loading">⏳ در حال بارگذاری سبد خرید...</div>';

            fetch(`${API_BASE}/api/cart/${userId}`)
                .then(response => {
                    if (!response.ok) throw new Error('خطا در دریافت اطلاعات');
                    return response.json();
                })
                .then(data => {
                    // به‌روزرسانی تعداد
                    document.getElementById('cartCount').textContent = data.length;

                    if (data.length === 0) {
                        container.innerHTML = `
                            <div class="empty">
                                <i class="fas fa-shopping-cart"></i>
                                <p>سبد خرید شما خالی است.</p>
                                <a href="index.html#assistant" class="btn btn-primary" style="margin-top:12px;">
                                    <i class="fas fa-plus"></i> افزودن خدمت
                                </a>
                            </div>
                        `;
                        return;
                    }

                    let total = 0;
                    let html = `
                        <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>نام خدمت</th>
                                    <th>قیمت</th>
                                    <th>تاریخ افزودن</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.forEach((item, index) => {
                        const price = parseFloat(item.item_price?.replace(/[^0-9.]/g, '') || 0);
                        if (!isNaN(price)) total += price;
                        
                        html += `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${item.item_name}</td>
                                <td>${item.item_price || '-'}</td>
                                <td>${item.created_at ? new Date(item.created_at).toLocaleDateString('fa-IR') : '-'}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm" onclick="removeFromCart(${item.id})">
                                        <i class="fas fa-trash-alt"></i> حذف
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `
                            </tbody>
                            <tfoot>
                                <tr style="font-weight:700; background:#f8f6ff;">
                                    <td colspan="2">مجموع</td>
                                    <td>${total.toLocaleString()} تومان</td>
                                    <td colspan="2"></td>
                                </tr>
                            </tfoot>
                        </table></div>
                        <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
                            <button class="btn btn-primary" onclick="showToast('🛒 در حال پردازش سفارش...', 'info')">
                                <i class="fas fa-check"></i> ثبت سفارش
                            </button>
                            <a href="index.html#assistant" class="btn btn-primary" style="text-decoration:none;">
                                <i class="fas fa-plus"></i> افزودن خدمت جدید
                            </a>
                        </div>
                    `;

                    container.innerHTML = html;
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    container.innerHTML = `
                        <div class="empty">
                            <i class="fas fa-exclamation-circle"></i>
                            <p>خطا در دریافت سبد خرید.</p>
                            <button onclick="loadCart(${userId})" class="btn btn-primary" style="margin-top:12px;">
                                <i class="fas fa-redo"></i> تلاش مجدد
                            </button>
                        </div>
                    `;
                });
        }

        // =============================================
        // ===== حذف از سبد خرید =====
        // =============================================
        function removeFromCart(cartId) {
            if (!confirm('آیا از حذف این آیتم از سبد خرید مطمئن هستید؟')) return;

            fetch(`${API_BASE}/api/cart/${cartId}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        showToast('✅ ' + data.message, 'success');
                        const user = checkUser();
                        if (user) loadCart(user.id);
                    } else {
                        showToast('❌ ' + data.error, 'error');
                    }
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    showToast('❌ خطا در حذف آیتم.', 'error');
                });
        }

        // =============================================
        // ===== مقداردهی اولیه =====
        // =============================================
        document.addEventListener('DOMContentLoaded', function() {
            const user = checkUser();
            if (!user) return;

            displayUserInfo(user);
            loadCart(user.id);
        });
    </script>
</body>
</html>
