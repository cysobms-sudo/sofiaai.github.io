<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مطالعه مقاله | توسعه‌دهنده هوش مصنوعی سوفیا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #f8f9fc;
            color: #1A0F2E;
            direction: rtl;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            animation: fadeUp 0.6s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .article-header {
            border-bottom: 2px solid #FFB800;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .article-header h1 {
            font-size: 2rem;
            font-weight: 900;
            color: #1A0F2E;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .article-header .meta {
            display: flex;
            gap: 16px;
            color: #7a7a9a;
            font-size: 0.9rem;
            flex-wrap: wrap;
        }
        .article-header .meta i { margin-left: 4px; }
        .article-body {
            font-size: 1.05rem;
            line-height: 2.2rem;
            color: #2d2d3f;
            text-align: justify;
        }
        .article-body p { margin-bottom: 16px; }
        .article-body h2, .article-body h3 {
            margin-top: 24px;
            margin-bottom: 12px;
            color: #1A0F2E;
        }
        .article-body ul, .article-body ol {
            padding-right: 24px;
            margin-bottom: 16px;
        }
        .article-body img {
            max-width: 100%;
            border-radius: 12px;
            margin: 16px 0;
        }
        .article-body blockquote {
            border-right: 4px solid #6C3CE1;
            padding-right: 16px;
            margin: 16px 0;
            color: #5A4A7A;
            font-style: italic;
        }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: #6C3CE1;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }
        .back-link:hover {
            text-decoration: underline;
            transform: translateX(-4px);
        }
        .loading {
            text-align: center;
            padding: 60px 0;
            color: #7a7a9a;
        }
        .loading i {
            font-size: 2rem;
            display: block;
            margin-bottom: 12px;
        }
        .error {
            text-align: center;
            padding: 60px 0;
            color: #e74c3c;
        }
        .error i {
            font-size: 2rem;
            display: block;
            margin-bottom: 12px;
        }
        .error .retry-btn {
            margin-top: 16px;
            padding: 10px 32px;
            background: #6C3CE1;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-family: 'Vazirmatn', sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }
        .error .retry-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(108, 60, 225, 0.3);
        }
        .category-badge {
            display: inline-block;
            background: rgba(108, 60, 225, 0.06);
            color: #6C3CE1;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .share-section {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .share-section .share-label {
            color: #7a7a9a;
            font-size: 0.9rem;
        }
        .share-section .share-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: none;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        .share-section .share-btn:hover {
            transform: scale(1.05);
        }
        .share-btn.telegram { background: #0088cc; color: #fff; }
        .share-btn.twitter { background: #1DA1F2; color: #fff; }
        .share-btn.linkedin { background: #0077b5; color: #fff; }
        .share-btn.whatsapp { background: #25D366; color: #fff; }
        .share-btn.copy { background: #6C3CE1; color: #fff; }

        .related-articles {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }
        .related-articles h4 {
            margin-bottom: 12px;
            color: #1A0F2E;
        }
        .related-articles .related-item {
            display: block;
            padding: 8px 0;
            color: #6C3CE1;
            text-decoration: none;
            transition: 0.3s;
        }
        .related-articles .related-item:hover {
            padding-right: 8px;
        }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            .article-header h1 { font-size: 1.5rem; }
            .article-body { font-size: 0.95rem; line-height: 2rem; }
            .share-section { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="container" id="articleContainer">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i>در حال بارگذاری مقاله...</div>
    </div>

    <script>
        // ===== تنظیمات =====
        const API_BASE = 'https://sofiaaisite.runflare.run';

        // ===== دریافت ID مقاله از آدرس =====
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        // =============================================
        // ===== بارگذاری مقاله =====
        // =============================================
        function loadArticle(id) {
            const container = document.getElementById('articleContainer');
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i>در حال بارگذاری مقاله...</div>';

            fetch(`${API_BASE}/api/articles/${id}`)
                .then(res => {
                    if (!res.ok) {
                        if (res.status === 404) throw new Error('مقاله یافت نشد');
                        throw new Error('خطا در دریافت مقاله');
                    }
                    return res.json();
                })
                .then(article => {
                    // ===== نمایش مقاله =====
                    const contentHtml = article.content
                        .replace(/\n/g, '<br>')
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\*(.*?)\*/g, '<em>$1</em>');

                    container.innerHTML = `
                        <div class="article-header">
                            <span class="category-badge">${article.category}</span>
                            <h1>${article.title}</h1>
                            <div class="meta">
                                <span><i class="far fa-user"></i> ${article.author || 'سوفیا AI'}</span>
                                <span><i class="far fa-calendar"></i> ${article.created_at}</span>
                                <span><i class="far fa-clock"></i> ${Math.ceil(article.content.split(' ').length / 200)} دقیقه مطالعه</span>
                            </div>
                        </div>
                        <div class="article-body">
                            ${contentHtml}
                        </div>
                        <div class="share-section">
                            <span class="share-label">اشتراک‌گذاری:</span>
                            <button class="share-btn telegram" onclick="shareArticle('telegram')"><i class="fab fa-telegram-plane"></i> تلگرام</button>
                            <button class="share-btn whatsapp" onclick="shareArticle('whatsapp')"><i class="fab fa-whatsapp"></i> واتساپ</button>
                            <button class="share-btn twitter" onclick="shareArticle('twitter')"><i class="fab fa-twitter"></i> توییتر</button>
                            <button class="share-btn linkedin" onclick="shareArticle('linkedin')"><i class="fab fa-linkedin-in"></i> لینکدین</button>
                            <button class="share-btn copy" onclick="copyLink()"><i class="fas fa-copy"></i> کپی لینک</button>
                        </div>
                        <a href="index.html#articles" class="back-link">← بازگشت به لیست مقالات</a>
                    `;

                    // ===== بارگذاری مقالات مرتبط =====
                    loadRelatedArticles(article.category, id);
                })
                .catch(error => {
                    console.error('❌ خطا:', error);
                    container.innerHTML = `
                        <div class="error">
                            <i class="fas fa-exclamation-circle"></i>
                            <h3>${error.message}</h3>
                            <p style="color:#7a7a9a; margin-top:8px;">متأسفانه مقاله مورد نظر یافت نشد.</p>
                            <button class="retry-btn" onclick="loadArticle('${id}')">تلاش مجدد</button>
                            <div style="margin-top:16px;">
                                <a href="index.html#articles" class="back-link">← بازگشت به لیست مقالات</a>
                            </div>
                        </div>
                    `;
                });
        }

        // =============================================
        // ===== مقالات مرتبط =====
        // =============================================
        function loadRelatedArticles(category, currentId) {
            const container = document.getElementById('articleContainer');
            
            fetch(`${API_BASE}/api/articles`)
                .then(res => res.json())
                .then(data => {
                    const related = data
                        .filter(a => a.id != currentId && a.category === category)
                        .slice(0, 3);
                    
                    if (related.length === 0) return;

                    let html = `
                        <div class="related-articles">
                            <h4>📚 مقالات مشابه</h4>
                    `;
                    related.forEach(article => {
                        html += `
                            <a href="article.html?id=${article.id}" class="related-item">
                                <i class="fas fa-arrow-left"></i> ${article.title}
                            </a>
                        `;
                    });
                    html += `</div>`;
                    
                    // اضافه کردن به انتهای صفحه
                    container.innerHTML += html;
                })
                .catch(err => {
                    console.error('❌ خطا در دریافت مقالات مرتبط:', err);
                });
        }

        // =============================================
        // ===== اشتراک‌گذاری =====
        // =============================================
        function shareArticle(platform) {
            const url = encodeURIComponent(window.location.href);
            const title = encodeURIComponent(document.querySelector('h1')?.textContent || 'مقاله سوفیا AI');
            let shareUrl = '';

            switch(platform) {
                case 'telegram':
                    shareUrl = `https://t.me/share/url?url=${url}&text=${title}`;
                    break;
                case 'whatsapp':
                    shareUrl = `https://wa.me/?text=${title}%20${url}`;
                    break;
                case 'twitter':
                    shareUrl = `https://twitter.com/intent/tweet?text=${title}&url=${url}`;
                    break;
                case 'linkedin':
                    shareUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${url}`;
                    break;
                default:
                    return;
            }

            window.open(shareUrl, '_blank', 'width=600,height=500');
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href)
                .then(() => {
                    showToast('✅ لینک مقاله کپی شد!', 'success');
                })
                .catch(() => {
                    // fallback
                    const input = document.createElement('input');
                    input.value = window.location.href;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    showToast('✅ لینک مقاله کپی شد!', 'success');
                });
        }

        // =============================================
        // ===== Toast =====
        // =============================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer') || createToastContainer();
            const toast = document.createElement('div');
            toast.style.cssText = `
                padding: 14px 24px;
                border-radius: 12px;
                color: #fff;
                font-weight: 600;
                font-family: 'Vazirmatn', sans-serif;
                box-shadow: 0 8px 30px rgba(0,0,0,0.15);
                animation: slideDown 0.5s ease;
                background: ${type === 'success' ? '#28a745' : type === 'error' ? '#e74c3c' : '#3498db'};
                min-width: 200px;
                text-align: center;
            `;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideUp 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function createToastContainer() {
            const container = document.createElement('div');
            container.id = 'toastContainer';
            container.style.cssText = `
                position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
                z-index: 9999; display: flex; flex-direction: column; gap: 10px;
                align-items: center; direction: rtl;
            `;
            document.body.appendChild(container);
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideDown {
                    from { opacity: 0; transform: translateX(-50%) translateY(-80px); }
                    to { opacity: 1; transform: translateX(-50%) translateY(0); }
                }
                @keyframes slideUp {
                    from { opacity: 1; transform: translateX(-50%) translateY(0); }
                    to { opacity: 0; transform: translateX(-50%) translateY(-80px); }
                }
            `;
            document.head.appendChild(style);
            return container;
        }

        // =============================================
        // ===== اجرا =====
        // =============================================
        if (!articleId) {
            document.getElementById('articleContainer').innerHTML = `
                <div class="error">
                    <i class="fas fa-exclamation-circle"></i>
                    <h3>هیچ مقاله‌ای انتخاب نشده است.</h3>
                    <div style="margin-top:16px;">
                        <a href="index.html#articles" class="back-link">← بازگشت به لیست مقالات</a>
                    </div>
                </div>
            `;
        } else {
            loadArticle(articleId);
        }
    </script>
</body>
</html>
