<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به توسعه دهنده هوش مصنوعی سوفیا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(145deg, #FBF8FF, #FFF9E6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 24px;
            border: 2px solid #FFB800;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.06);
            animation: fadeUp 0.6s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            text-align: center;
            color: #1A0F2E;
            margin-bottom: 24px;
            font-size: 2rem;
        }
        h1 .highlight {
            background: linear-gradient(145deg, #6C3CE1, #FFB800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            color: #1A0F2E;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid rgba(108, 60, 225, 0.08);
            font-size: 1rem;
            margin-top: 6px;
            font-family: 'Vazirmatn', sans-serif;
            transition: 0.3s;
        }
        input:focus {
            border-color: #6C3CE1;
            outline: none;
            box-shadow: 0 0 0 3px rgba(108, 60, 225, 0.08);
        }
        button {
            width: 100%;
            margin-top: 24px;
            background: linear-gradient(145deg, #6C3CE1, #4A1F9E);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(108, 60, 225, 0.3);
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .register-link {
            text-align: center;
            margin-top: 16px;
            color: #5A4A7A;
        }
        .register-link a {
            color: #6C3CE1;
            font-weight: 700;
            text-decoration: none;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .message {
            text-align: center;
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #6C3CE1;
            text-decoration: none;
            font-weight: 400;
            text-align: center;
            width: 100%;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .forgot-password {
            text-align: center;
            margin-top: 8px;
            font-size: 0.85rem;
        }
        .forgot-password a {
            color: #7a7a9a;
            text-decoration: none;
        }
        .forgot-password a:hover {
            color: #6C3CE1;
        }
        .login-icon {
            font-size: 3rem;
            text-align: center;
            color: #6C3CE1;
            margin-bottom: 8px;
        }
        @media (max-width: 480px) {
            .container { padding: 24px 16px; }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-icon">🔑</div>
        <h1>ورود به <span class="highlight">توسعه دهنده هوش مصنوعی سوفیا</span></h1>
        
        <form id="loginForm">
            <label>آدرس ایمیل</label>
            <input type="email" id="email" placeholder="ایمیل خود را وارد کنید" required autofocus />
            
            <label>رمز عبور</label>
            <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید" required />
            
            <button type="submit" id="submitBtn">ورود</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="register-link">
            ثبت‌نام نکرده‌اید؟ <a href="register.html">ثبت‌نام کنید</a>
        </div>
        <div class="forgot-password">
            <a href="#">رمز عبور خود را فراموش کرده‌اید؟</a>
        </div>
        <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
    </div>

    <script>
        const API_BASE = 'https://sofiaaisite.sofiaai.ir';

        // ===== بررسی وضعیت ورود =====
        function checkUserStatus() {
            const userData = localStorage.getItem('user');
            if (userData) {
                // اگر کاربر قبلاً وارد شده، به داشبورد هدایت شود
                window.location.href = 'dashboard.html';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            
            // ===== اعتبارسنجی =====
            if (!email || !password) {
                showMessage('❌ لطفاً ایمیل و رمز عبور را وارد کنید.', 'error');
                return;
            }
            
            // ===== غیرفعال کردن دکمه =====
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ در حال بررسی...';
            
            try {
                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // ===== ذخیره اطلاعات کاربر در localStorage =====
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    showMessage('✅ ورود با موفقیت انجام شد! در حال انتقال به داشبورد...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showMessage('❌ ' + (data.error || 'ایمیل یا رمز عبور اشتباه است.'), 'error');
                }
            } catch (error) {
                console.error('❌ خطا:', error);
                showMessage('❌ خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'ورود';
            }
        });
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }

        // ===== ورود با کلید Enter =====
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        document.getElementById('email').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('password').focus();
            }
        });

        // ===== بررسی وضعیت کاربر هنگام بارگذاری =====
        document.addEventListener('DOMContentLoaded', checkUserStatus);
    </script>
</body>
</html>
