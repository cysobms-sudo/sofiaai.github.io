<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت‌نام در سوفیا AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: linear-gradient(145deg, #FBF8FF, #FFF9E6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 24px;
            border: 2px solid #FFB800;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(108, 60, 225, 0.06);
            animation: fadeUp 0.6s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            text-align: center;
            color: #1A0F2E;
            margin-bottom: 24px;
            font-size: 2rem;
        }
        h1 .highlight {
            background: linear-gradient(145deg, #6C3CE1, #FFB800);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            color: #1A0F2E;
        }
        label .required {
            color: #e74c3c;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid rgba(108, 60, 225, 0.08);
            font-size: 1rem;
            margin-top: 6px;
            font-family: 'Vazirmatn', sans-serif;
            transition: 0.3s;
        }
        input:focus {
            border-color: #6C3CE1;
            outline: none;
            box-shadow: 0 0 0 3px rgba(108, 60, 225, 0.08);
        }
        input.error {
            border-color: #e74c3c;
        }
        .password-hint {
            font-size: 0.8rem;
            color: #7a7a9a;
            margin-top: 4px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            background: linear-gradient(145deg, #6C3CE1, #4A1F9E);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Vazirmatn', sans-serif;
        }
        button:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 25px rgba(108, 60, 225, 0.3);
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .login-link {
            text-align: center;
            margin-top: 16px;
            color: #5A4A7A;
        }
        .login-link a {
            color: #6C3CE1;
            font-weight: 700;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .message {
            text-align: center;
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .message.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .back-link {
            display: inline-block;
            margin-top: 16px;
            color: #6C3CE1;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
            width: 100%;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e8ecf1;
            border-radius: 4px;
            margin-top: 16px;
            overflow: hidden;
            display: none;
        }
        .progress-bar .progress {
            height: 100%;
            background: linear-gradient(145deg, #6C3CE1, #FFB800);
            width: 0%;
            border-radius: 4px;
            animation: progress 2s ease-in-out infinite;
        }
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        .success-icon {
            font-size: 3rem;
            text-align: center;
            color: #28a745;
            display: none;
            margin-bottom: 8px;
        }
        @media (max-width: 480px) {
            .container { padding: 24px 16px; }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ثبت‌نام در <span class="highlight">سوفیا AI</span></h1>
        <div class="success-icon" id="successIcon">✅</div>
        
        <form id="registerForm">
            <label>نام و نام خانوادگی <span class="required">*</span></label>
            <input type="text" id="name" placeholder="نام خود را وارد کنید" required autofocus />
            
            <label>آدرس ایمیل <span class="required">*</span></label>
            <input type="email" id="email" placeholder="ایمیل خود را وارد کنید" required />
            
            <label>رمز عبور <span class="required">*</span></label>
            <input type="password" id="password" placeholder="حداقل ۴ کاراکتر" required minlength="4" />
            <div class="password-hint">رمز عبور باید حداقل ۴ کاراکتر باشد</div>
            
            <label>تکرار رمز عبور <span class="required">*</span></label>
            <input type="password" id="passwordConfirm" placeholder="رمز عبور را تکرار کنید" required minlength="4" />
            
            <label>شماره تماس</label>
            <input type="tel" id="phone" placeholder="شماره تماس خود را وارد کنید" />
            
            <button type="submit" id="submitBtn">ثبت‌نام</button>
        </form>
        
        <div id="message" class="message"></div>
        
        <div class="progress-bar" id="progressBar">
            <div class="progress"></div>
        </div>
        
        <div class="login-link">
            قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html">وارد شوید</a>
        </div>
        <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
    </div>

    <script>
        const API_BASE = 'https://sofiaaisite.runflare.run';

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const phone = document.getElementById('phone').value.trim();
            
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            const progressBar = document.getElementById('progressBar');
            const successIcon = document.getElementById('successIcon');
            
            // ===== اعتبارسنجی =====
            if (!name || !email || !password) {
                showMessage('❌ لطفاً تمام فیلدهای الزامی را پر کنید.', 'error');
                return;
            }
            
            if (password.length < 4) {
                showMessage('❌ رمز عبور باید حداقل ۴ کاراکتر باشد.', 'error');
                return;
            }
            
            if (password !== passwordConfirm) {
                showMessage('❌ رمز عبور و تکرار آن مطابقت ندارند.', 'error');
                return;
            }
            
            // ===== غیرفعال کردن دکمه =====
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ در حال ثبت‌نام...';
            progressBar.style.display = 'block';
            successIcon.style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE}/api/register`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password, phone })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // ===== ذخیره اطلاعات کاربر در localStorage =====
                    if (data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }
                    
                    successIcon.style.display = 'block';
                    showMessage('✅ ثبت‌نام با موفقیت انجام شد! در حال انتقال به صفحه اصلی...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    showMessage('❌ ' + (data.error || 'خطا در ثبت‌نام. لطفاً دوباره تلاش کنید.'), 'error');
                }
            } catch (error) {
                console.error('❌ خطا:', error);
                showMessage('❌ خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'ثبت‌نام';
                progressBar.style.display = 'none';
            }
        });
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';
        }
        
        // ===== اعتبارسنجی زنده رمز عبور =====
        document.getElementById('passwordConfirm').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirm = this.value;
            const hint = document.querySelector('.password-hint');
            
            if (confirm.length > 0 && password !== confirm) {
                this.classList.add('error');
                hint.textContent = '⚠️ رمز عبور با تکرار آن مطابقت ندارد';
                hint.style.color = '#e74c3c';
            } else {
                this.classList.remove('error');
                hint.textContent = 'رمز عبور باید حداقل ۴ کاراکتر باشد';
                hint.style.color = '#7a7a9a';
            }
        });
        
        document.getElementById('password').addEventListener('input', function() {
            const confirm = document.getElementById('passwordConfirm');
            if (confirm.value.length > 0 && this.value !== confirm.value) {
                confirm.classList.add('error');
            } else {
                confirm.classList.remove('error');
            }
        });
    </script>
</body>
</html>
