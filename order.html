<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ثبت درخواست | Sofia AI</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:Tahoma;background:linear-gradient(135deg,#667eea,#764ba2);direction:rtl;padding:20px;}
        .container{max-width:700px;margin:0 auto;background:white;border-radius:25px;padding:40px;}
        h1{color:#667eea;text-align:center;margin-bottom:30px;}
        .form-group{margin-bottom:20px;}
        label{display:block;margin-bottom:8px;font-weight:bold;color:#333;}
        input,select,textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:10px;font-size:1em;}
        input:focus,select:focus,textarea:focus{border-color:#667eea;outline:none;}
        .btn{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:15px;border:none;border-radius:50px;font-size:1.2em;font-weight:bold;cursor:pointer;width:100%;}
        .back-link{display:block;text-align:center;margin-top:20px;color:#667eea;text-decoration:none;}
        footer{text-align:center;margin-top:30px;color:#999;}
    </style>
</head>
<body>
<div class="container">
    <h1>📋 فرم ثبت درخواست</h1>
    <form action="https://formspree.io/f/xpqeqkgk" method="POST">
        <input type="hidden" name="_subject" value="سفارش جدید از سایت Sofia AI">
        <div class="form-group"><label>نام و نام خانوادگی *</label><input type="text" name="name" required></div>
        <div class="form-group"><label>شماره تماس *</label><input type="tel" name="phone" required></div>
        <div class="form-group"><label>ایمیل</label><input type="email" name="email"></div>
        <div class="form-group"><label>سیستم عامل *</label><select name="os" required><option value="">انتخاب کنید...</option><option value="windows">ویندوز</option><option value="mac">مک</option><option value="linux">لینوکس</option></select></div>
        <div class="form-group"><label>میزان رم *</label><select name="ram" required><option value="">انتخاب کنید...</option><option value="8">8GB</option><option value="16">16GB</option><option value="32">32GB</option></select></div>
        <div class="form-group"><label>توضیحات</label><textarea name="notes" rows="3"></textarea></div>
        <button type="submit" class="btn">📝 ثبت درخواست</button>
    </form>
    <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
    <footer>پس از ثبت، حداکثر 24 ساعت با شما تماس می‌گیریم</footer>
</div>
</body>
</html>
